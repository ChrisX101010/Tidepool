// ---- scene --------------------------------------------------------
function draw(t){
  var gkey=sky.top+sky.bot+HORIZON;
  if(!skyGrad||skyGradKey!==gkey){
    skyGrad=ctx.createLinearGradient(0,0,0,HORIZON);
    skyGrad.addColorStop(0,sky.top);
    skyGrad.addColorStop(0.72,sky.mid);
    skyGrad.addColorStop(1,sky.bot);
    skyGradKey=gkey;
  }
  ctx.fillStyle=skyGrad; ctx.fillRect(0,0,W,HORIZON);

  drawStars(t); drawMeteors(); drawClouds();

  var sx=projAz(sun.az), sy=HORIZON-4-(sun.alt/90)*(HORIZON-10);
  if(sun.alt>-0.9 && inView(sun.az)){
    var rr=Math.round(sx), ry=Math.round(sy);
    // low sun burns orange, high sun goes near-white; the corona is a real
    // radial falloff rather than a square, which is what looked like cloud
    var lowness=Math.max(0,Math.min(1,(16-sun.alt)/20));
    var core = lowness>0.75 ? "#FFB367" : lowness>0.42 ? "#FFD79A" : "#FFF8E6";
    var halo = lowness>0.75 ? "255,150,80" : lowness>0.42 ? "255,196,120" : "255,238,196";
    var R=26+lowness*26;
    var gg=ctx.createRadialGradient(rr+1,ry+1,0,rr+1,ry+1,R);
    gg.addColorStop(0,   "rgba("+halo+","+(0.42+lowness*0.22)+")");
    gg.addColorStop(0.16,"rgba("+halo+","+(0.20+lowness*0.14)+")");
    gg.addColorStop(0.45,"rgba("+halo+","+(0.07+lowness*0.06)+")");
    gg.addColorStop(1,   "rgba("+halo+",0)");
    ctx.fillStyle=gg;
    ctx.fillRect(rr-R,ry-R,R*2,R*2);
    // the disc, drawn as a rounded pixel blob
    ctx.fillStyle=core;
    ctx.fillRect(rr-4,ry-2,10,5); ctx.fillRect(rr-2,ry-4,6,9);
    ctx.fillRect(rr-3,ry-3,8,7);
    ctx.fillStyle= lowness>0.6 ? "#FFE0AE" : "#FFFFF4";
    ctx.fillRect(rr-1,ry-1,3,3);
  } else {
    if(moon.alt>-2 && inView(moon.az)) drawMoon(projAz(moon.az), projAlt(moon.alt));
  }

  drawGulls();

  // ---- sea, in bands that get taller and slower toward the shore
  // Reach well below the lowest possible waterline: tide can drop it 8px and
  // the wobble another 3. Anything short of that leaves canvas unpainted, and
  // whatever was drawn there last frame stays put.
  ctx.fillStyle=sky.sea; ctx.fillRect(0,HORIZON,W,(EDGE+16)-HORIZON);

  if(sun.alt>-7 && inView(sun.az)){
    ctx.fillStyle="rgba(255,228,175,"+(0.09+sky.glow*0.07)+")";
    for(var k=0;k<20;k++){
      var yy=HORIZON+k*4, wob=reduced?0:Math.sin(t*1.1+k*0.9)*(2+k*0.5);
      if(yy>(EDGE-tide.height*8)-4) break;
      ctx.fillRect((sx-8-k*1.4+wob)|0,yy,(16+k*2.6)|0,1);
    }
  } else if(moon.alt>2 && moon.lit>0.15 && inView(moon.az)){
    var mpx=projAz(moon.az);
    ctx.fillStyle="rgba(200,220,245,"+(0.05*sky.glow*moon.lit)+")";
    for(var q2=0;q2<13;q2++){
      var wy2=HORIZON+q2*4, wb=reduced?0:Math.sin(t*0.9+q2)*(2+q2*0.4);
      if(wy2>(EDGE-tide.height*8)-4) break;
      ctx.fillRect((mpx-5-q2+wb)|0,wy2,(10+q2*1.8)|0,1);
    }
  }

  drawFarLights();
  drawCloudShadows();
  drawWakes();
  drawPods();
  drawWhale();
  drawShips();

  // the far water is not empty: a fine stipple of distant ripple, too small
  // to resolve into waves, which is what the flat band was missing
  for(var fr=0;fr<7;fr++){
    var fy=HORIZON+1+fr*2;
    if(fy>HORIZON+16) break;
    var al=0.035-fr*0.004;
    ctx.fillStyle="rgba(234,242,240,"+al+")";
    for(var fxp=(fr%2)*3;fxp<W;fxp+=6){
      var jit=Math.sin(fxp*0.21+t*(0.11+fr*0.02)+fr*2.1);
      if(jit>0.25) ctx.fillRect(fxp,fy,2,1);
    }
  }

  // The water's edge moves with the tide, so the whole swell has to be laid
  // out against it. Drawn against a fixed EDGE, waves ran over ground that
  // was dry — straight across the pier piles at low water.
  var WY = EDGE - tide.height*8;

  // swell: perspective rows, each crest breaking whiter as it nears the beach
  var boost=1+level*1.3;
  var rows=16;
  for(var w=0;w<rows;w++){
    var f=w/rows;
    var wy=HORIZON+6+Math.pow(f,1.45)*(WY-HORIZON-8);
    if(wy>WY-1) continue;                 // never below the water's edge
    var amp=(0.5+f*3.2)*boost*(0.6+tide.range*0.55);
    // tidal streams run fastest at mid-tide and stop at slack water
    var flow=0.30+tide.current*0.55;
    var speed=reduced?0:t*(0.34-f*0.17)*flow;
    var alpha=0.03+f*f*0.24;
    var bio=bioBloom*f*f, glowRow=(bio>0.05);
    // one path for the row, one fill: far cheaper than a fillRect per column
    ctx.fillStyle="rgba(234,242,240,"+alpha+")";
    ctx.beginPath();
    for(var x=0;x<W;x+=2){
      var ph=x*(0.055-f*0.028)+speed*1.7+w*0.8;
      var crest=Math.sin(ph);
      if(glowRow && crest>0.35) continue;         // drawn in the glow pass
      var yy2=wy+crest*amp+Math.sin(ph*0.37+w)*amp*0.4;
      ctx.rect(x,yy2|0,2,1+(f>0.72&&crest>0.55?1:0));
    }
    ctx.fill();
    if(glowRow){
      ctx.fillStyle="rgba(90,240,225,"+(bio*0.4)+")";
      ctx.beginPath();
      for(var x2=0;x2<W;x2+=2){
        var ph2=x2*(0.055-f*0.028)+speed*1.7+w*0.8;
        var c2=Math.sin(ph2);
        if(c2<=0.35) continue;
        var y3=wy+c2*amp+Math.sin(ph2*0.37+w)*amp*0.4;
        ctx.rect(x2,y3|0,2,1+(f>0.72&&c2>0.55?1:0));
      }
      ctx.fill();
    }
  }

  // moored craft sit ON the water, so they go over the swell, not under it
  drawBuoy(t);
  drawMoorings(t);

  drawHeadland(t);
  drawRockSurf(t);

  // ---- beach: a hard, unambiguous line between water and sand
  // high water pushes the whole waterline up the beach, low water pulls it back
  var tideY=-tide.height*8;
  var shoreY=function(x){ return EDGE + tideY + Math.sin(x*0.019+(reduced?0:t*0.11))*2.5 };

  ctx.fillStyle=sky.sand;
  ctx.beginPath(); ctx.moveTo(0,H);
  for(var s3=0;s3<=W;s3+=4) ctx.lineTo(s3,shoreY(s3));
  ctx.lineTo(W,H); ctx.closePath(); ctx.fill();

  // wet sand strip, darker, right at the waterline
  ctx.fillStyle="rgba(0,0,0,0.16)";
  ctx.beginPath();
  for(var wx2=0;wx2<=W;wx2+=2) ctx.rect(wx2,shoreY(wx2)|0,2,6);
  ctx.fill();
  // the strand line: sand the tide has uncovered since high water, paler
  if(tide.height<0.15){
    ctx.fillStyle="rgba(255,255,255,"+(0.035*(0.15-tide.height))+")";
    for(var st2=0;st2<=W;st2+=2)
      ctx.fillRect(st2,(shoreY(st2)+7)|0,2,Math.max(1,Math.round(-tide.height*7)));
  }
  // foam edge
  var surge=Math.sin(washPhase)*2.2*(0.6+washStrength*0.7);
  ctx.fillStyle="rgba(255,255,255,0.55)";
  for(var fx2=0;fx2<=W;fx2+=2){
    var fe=shoreY(fx2)+surge+Math.sin(fx2*0.14+t*1.6)*0.9;
    ctx.fillRect(fx2,fe|0,2,1);
  }
  ctx.fillStyle="rgba(255,255,255,0.16)";
  for(var fx3=0;fx3<=W;fx3+=2){
    var fe2=shoreY(fx3)+surge+2+Math.sin(fx3*0.11+t*1.3)*1.1;
    ctx.fillRect(fx3,fe2|0,2,1);
  }
  // dry sand speckle: fixed positions, so it can be drawn as one path
  ctx.fillStyle="rgba(0,0,0,0.06)";
  ctx.beginPath();
  for(var d=0;d<70;d++){
    ctx.rect((d*67)%W, EDGE+12+((d*37)%(H-EDGE-14)), 1,1);
  }
  ctx.fill();

  drawCinema(t);
  drawBeachDetail(t, shoreY); // shells, weed, footprints — these DO get covered
  drawStones();
  drawSplashes();
  drawWash(t, shoreY);        // the sheet lies on the sand...
  drawBeachStanding(t, shoreY);  // ...and runs around anything standing in it
  drawPier(t, shoreY);        // the pier stands in it too — and he walks past it
  drawCrabs(t);
  drawWalker();               // ...he stands in front of all of it...
  drawAnkleWash(t, shoreY);   // ...and only his ankles get covered
  drawBottle(t, shoreY);
  drawBird();
  drawFireflies();
  drawPops();
}

function washReach(){
  var cyc=(Math.sin(washPhase)*0.5+0.5);
  return cyc*cyc*(9+washStrength*17)*(0.7+tide.range*0.45);
}

// Only the last few pixels of water are drawn over him, so the swash covers
// his ankles and never his body.
function drawAnkleWash(t, shoreY){
  var reach=washReach(); if(reach<0.6) return;
  var cyc=(Math.sin(washPhase)*0.5+0.5);
  var x=Math.round(walker.x);
  var base=shoreY(x);
  var wob=Math.sin(x*0.031+washPhase*1.3)*2.2+Math.sin(x*0.011-washPhase)*1.4;
  var top=base+reach+wob;
  if(top<GROUND-3) return;                 // water has not reached him yet
  var band=Math.min(3,Math.max(1,top-(GROUND-3)));
  var bio=false;   // he is standing on sand, not in the bloom
  // a thin, uneven film rather than a solid block: each column gets its own
  // depth, so the edge is ragged the way water on sand actually is
  for(var wxp=-5;wxp<=5;wxp++){
    var ripple=Math.sin((x+wxp)*0.9+washPhase*5.2)*0.5+Math.sin((x+wxp)*2.3-t*3.1)*0.35;
    var d=band+ripple;
    if(d<0.35) continue;
    var h=Math.max(1,Math.round(Math.min(2.4,d)));
    ctx.fillStyle= bio ? "rgba(110,238,226,"+(0.30+0.12*cyc)+")"
                       : "rgba(158,202,212,"+(0.26+0.12*cyc)+")";
    ctx.fillRect(x+wxp,GROUND,1,h);
  }
  // foam curling round his ankles, broken not continuous
  for(var fxp=-5;fxp<=5;fxp++){
    var n=Math.sin((x+fxp)*1.7+washPhase*4.1);
    if(n<0.05) continue;
    ctx.fillStyle= bio ? "rgba(170,255,246,"+(0.45*n)+")" : "rgba(255,255,255,"+(0.42*n)+")";
    ctx.fillRect(x+fxp,GROUND-1,1,1);
  }
  // water parting round each leg
  if(band>1.2){
    var sw2=0.35+0.3*Math.sin(t*4.4);
    ctx.fillStyle= bio ? "rgba(190,255,248,"+sw2+")" : "rgba(255,255,255,"+sw2+")";
    ctx.fillRect(x-4,GROUND-1,1,1); ctx.fillRect(x+4,GROUND,1,1);
    ctx.fillRect(x-3,GROUND+1,1,1);
  }
}

// The swash: each wave runs up the sand and drains back.
function drawWash(t, shoreY){
  var cyc=(Math.sin(washPhase)*0.5+0.5);
  var reach=cyc*cyc*(9+washStrength*17);
  if(reach<0.6) return;
  var lead=1-cyc;

  for(var x=0;x<=W;x+=2){
    var base=shoreY(x);
    var wob=Math.sin(x*0.031+washPhase*1.3)*2.2+Math.sin(x*0.011-washPhase)*1.4;
    var top=base+reach+wob;
    var depth=Math.max(0,(base+reach+wob)-base);
    if(depth<=0) continue;
    // thin sheet of water lying on the sand
    ctx.fillStyle="rgba(150,196,206,"+(0.10+0.08*cyc)+")";
    ctx.fillRect(x,Math.round(base),2,Math.round(depth));
    // the bright lip at the furthest point of the run
    // the glow lives in the water; once the sheet is up the sand it is
    // just white foam again
    var seaward = top < base+3;
    if(bioBloom>0.05 && seaward){
      ctx.fillStyle="rgba(120,250,235,"+((0.34+0.26*lead)*bioBloom+0.10)+")";
      ctx.fillRect(x,Math.round(top),2,1);
    }
    ctx.fillStyle="rgba(255,255,255,"+((0.42+0.34*lead)*(seaward?(1-bioBloom*0.5):1))+")";
    ctx.fillRect(x,Math.round(top),2,1);
    ctx.fillStyle="rgba(255,255,255,0.18)";
    ctx.fillRect(x,Math.round(top)-1,2,1);
  }
  // foam left behind as it drains back
  if(cyc<0.45){
    for(var f=0;f<48;f++){
      var fx=(f*97)%W;
      var fy=shoreY(fx)+reach*0.55+((f*29)%5);
      ctx.fillStyle="rgba(255,255,255,"+(0.10*(0.45-cyc)/0.45)+")";
      ctx.fillRect(fx,Math.round(fy),2,1);
    }
  }
}

function drawHeadland(t){
  var night=sky.glow>0.5;
  var rock  = night ? "#050A12" : "#3A4740";
  var rock2 = night ? "#0A121C" : "#47554C";
  var rock3 = night ? "#0D1721" : "#556354";
  var grass = night ? "#071019" : "#4E6A4A";

  // ---- the headland: layered rock, not one flat wedge -----------------
  ctx.fillStyle=rock2;
  ctx.beginPath();
  ctx.moveTo(0,HORIZON+4); ctx.lineTo(0,HORIZON-13);
  ctx.lineTo(7,HORIZON-17);
  ctx.lineTo(30,HORIZON-17);          // a flat headland for the tower to sit on
  ctx.lineTo(38,HORIZON-14); ctx.lineTo(50,HORIZON-7);
  ctx.lineTo(64,HORIZON); ctx.lineTo(80,HORIZON+4);
  ctx.closePath(); ctx.fill();
  // upper bluff, catching whatever light there is
  ctx.fillStyle=rock3;
  ctx.beginPath();
  ctx.moveTo(0,HORIZON-13); ctx.lineTo(7,HORIZON-17);
  ctx.lineTo(30,HORIZON-17); ctx.lineTo(34,HORIZON-12); ctx.lineTo(0,HORIZON-9);
  ctx.closePath(); ctx.fill();
  // a scrub line along the crest
  ctx.fillStyle=grass;
  ctx.fillRect(1,HORIZON-15,6,2); ctx.fillRect(24,HORIZON-18,8,2);
  ctx.fillRect(34,HORIZON-13,9,2); ctx.fillRect(47,HORIZON-7,8,2);
  // dark cut of rock at the waterline, and boulders at the foot
  ctx.fillStyle=rock;
  ctx.fillRect(0,HORIZON+1,70,3);
  ctx.fillRect(52,HORIZON-1,7,3); ctx.fillRect(61,HORIZON,6,3);
  ctx.fillRect(43,HORIZON+1,6,2); ctx.fillRect(34,HORIZON+2,5,2);

  // ---- the lighthouse, centred on its own plinth ----------------------
  var LX=18;                         // trunk centre, well inside the plateau
  var base=HORIZON-17;
  ctx.fillStyle=rock;
  ctx.fillRect(LX-5,base-1,11,3);    // plinth, symmetric about LX
  ctx.fillStyle=night?"#0B131D":"#C9C3B6";
  ctx.fillRect(LX-3,base-6,7,6);     // wide lower course
  ctx.fillRect(LX-2,base-13,5,7);    // tapered shaft
  ctx.fillRect(LX-2,base-18,5,5);    // upper shaft
  if(!night){
    ctx.fillStyle="#A8433A";         // the classic red bands
    ctx.fillRect(LX-3,base-5,7,2);
    ctx.fillRect(LX-2,base-12,5,2);
  } else {
    ctx.fillStyle="#060D16";
    ctx.fillRect(LX-3,base-5,7,2); ctx.fillRect(LX-2,base-12,5,2);
  }
  ctx.fillStyle=night?"#070E17":"#8E887C";
  ctx.fillRect(LX-4,base-20,9,2);    // gallery deck, overhanging both sides
  ctx.fillRect(LX-4,base-21,1,1); ctx.fillRect(LX+4,base-21,1,1);   // rail posts
  ctx.fillStyle=night?"#0A121C":"#6E6A60";
  ctx.fillRect(LX-2,base-25,5,4);    // lantern room housing
  ctx.fillStyle=night?"#070E17":"#57534B";
  ctx.fillRect(LX-3,base-27,7,2);    // roof
  ctx.fillRect(LX,base-29,1,2);      // finial

  if(sky.glow<0.42){
    ctx.fillStyle="rgba(150,182,204,0.62)";
    ctx.fillRect(LX-1,base-24,3,3);  // daylight glass
    ctx.fillStyle="rgba(226,240,250,0.5)";
    ctx.fillRect(LX-1,base-24,1,3);
  }

  if(sky.glow>0.42){
    var PERIOD=7.5, lx=LX, ly=base-23;
    var ang=(lightPhase/PERIOD)*Math.PI*2;
    var d=Math.atan2(Math.sin(ang),Math.cos(ang));
    var SIG=0.30;
    var I=Math.exp(-(d*d)/(2*SIG*SIG));
    var glowI=I*sky.glow;
    var sweep=Math.sin(ang)*0.55;
    if(glowI>0.006){
      var len=210, spread=13+glowI*9;
      var bx=lx+len, byc=ly+sweep*46;
      var grd=ctx.createLinearGradient(lx,ly,bx,byc);
      grd.addColorStop(0,"rgba(255,244,210,"+(glowI*0.22)+")");
      grd.addColorStop(0.55,"rgba(255,240,200,"+(glowI*0.09)+")");
      grd.addColorStop(1,"rgba(255,238,196,0)");
      ctx.fillStyle=grd;
      ctx.beginPath(); ctx.moveTo(lx,ly-2); ctx.lineTo(lx,ly+2);
      ctx.lineTo(bx,byc+spread); ctx.lineTo(bx,byc-spread);
      ctx.closePath(); ctx.fill();
      var hg=ctx.createRadialGradient(lx,ly,0,lx,ly,17+glowI*13);
      hg.addColorStop(0,"rgba(255,246,216,"+(glowI*0.5)+")");
      hg.addColorStop(1,"rgba(255,246,216,0)");
      ctx.fillStyle=hg; ctx.fillRect(lx-32,ly-32,66,66);
    }
    ctx.fillStyle="rgba(255,244,212,"+(0.20+0.80*I)+")";
    ctx.fillRect(LX-1,base-24,3,3);
    if(I>0.55){ ctx.fillStyle="rgba(255,255,240,"+((I-0.55)/0.45)+")"; ctx.fillRect(LX,base-24,1,2) }
  }

  // ---- the island: a real islet, big enough to hide a boat behind -----
  var ix=LM.island, iy=HORIZON;
  // clear anything drawn behind it, so nothing shows through the land
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(ix-30,iy+4); ctx.lineTo(ix-24,iy-2); ctx.lineTo(ix-14,iy-6);
  ctx.lineTo(ix-2,iy-8);  ctx.lineTo(ix+11,iy-6); ctx.lineTo(ix+21,iy-2);
  ctx.lineTo(ix+28,iy+4);
  ctx.closePath();
  ctx.fillStyle=sky.sea; ctx.fill();     // occlude
  ctx.clip();
  ctx.fillStyle=rock2;
  ctx.fillRect(ix-32,iy-10,64,16);
  // a sandy fringe where the island meets the water
  ctx.fillStyle= night ? "#111A24" : "#B9A484";
  ctx.fillRect(ix-32,iy+1,64,4);
  // rock outcrop on the seaward side
  ctx.fillStyle=rock3;
  ctx.fillRect(ix+9,iy-6,12,6); ctx.fillRect(ix+15,iy-8,7,4);
  ctx.fillStyle=rock;
  ctx.fillRect(ix-24,iy-1,10,3);
  // low scrub across the top
  ctx.fillStyle=grass;
  ctx.fillRect(ix-19,iy-7,13,3); ctx.fillRect(ix-6,iy-9,12,3);
  ctx.fillRect(ix+4,iy-7,9,2);
  ctx.restore();

  // ---- the palm: base planted, bend increasing up the trunk ----------
  var wv=reduced?0.25:wind.val;
  var px=ix-3, py=iy-8, TH=17;
  var sway=Math.sin(t*1.9+wind.phase*3)*0.35+Math.sin(t*0.7)*0.2;
  ctx.fillStyle= night ? "#0A121C" : "#6B5136";
  var tipX=px, tipY=py-TH;
  for(var seg=0; seg<TH; seg++){
    var f=seg/(TH-1);
    // quadratic: no movement at the root, most at the crown
    var bend=(wv*3.4+sway)*f*f;
    var sxp=Math.round(px+bend);
    ctx.fillRect(sxp, py-seg, seg<5?2:1, 1);
    if(seg===TH-1){ tipX=sxp; tipY=py-seg }
  }
  // frond crown, streaming downwind
  ctx.fillStyle= night ? "#0B141E" : "#4F7040";
  var flut=Math.sin(t*4.2+wind.phase*5)*wv*0.9;
  var fronds=[[-1,-3,-6,0],[1,-3,7,1],[-1,-2,-8,3],[1,-2,9,3],[0,-4,2,-3],[0,-4,-3,-3]];
  for(var fr=0;fr<fronds.length;fr++){
    var F=fronds[fr];
    var ex=tipX+F[2]+Math.round(wv*1.8)+ (F[2]>0?Math.round(flut):-Math.round(flut));
    var ey=tipY+F[3]+Math.round(F[2]>0? flut*0.6 : -flut*0.6);
    // draw each frond as a short tapering run of pixels
    var steps=Math.max(2,Math.abs(ex-tipX));
    for(var st=0;st<=steps;st++){
      var q=st/steps;
      var qx=Math.round(tipX+(ex-tipX)*q);
      var qy=Math.round(tipY+F[1]*(1-q)*0.4+(ey-tipY)*q*q);
      ctx.fillRect(qx,qy,1,1);
      if(q>0.25&&q<0.8) ctx.fillRect(qx,qy+1,1,1);
    }
  }
  // coconuts tucked under the crown
  ctx.fillStyle= night ? "#0A121C" : "#4A3524";
  ctx.fillRect(tipX-1,tipY+2,1,1); ctx.fillRect(tipX+1,tipY+3,1,1);
}

function drawCinema(t){

// Water working around a pile: a lick of foam either side, a faint ring, and
// once in a while a small lap against it. Deliberately quieter than a stone
// going in — you should half-notice it.
function drawPileWash(px, waterY, t, seed, scale){
  scale=scale||1;
  var sw=Math.sin(t*1.15+seed)*0.5+Math.sin(t*0.47+seed*2.1)*0.5;
  var lift=Math.round(sw*1.2*scale);
  var wy=Math.round(waterY)+lift;

  // the standing collar where the water meets the pile
  ctx.fillStyle="rgba(255,255,255,"+(0.20+0.10*Math.abs(sw))+")";
  ctx.fillRect(px-2,wy,5,1);
  ctx.fillStyle="rgba(255,255,255,0.13)";
  ctx.fillRect(px-4,wy+1,3,1); ctx.fillRect(px+2,wy+1,3,1);

  // a ring drifting outward, restarting on its own slow cycle
  var ph=((t*0.42+seed)%1);
  var r=1+ph*7*scale;
  var a=(1-ph)*0.22;
  if(a>0.02){
    ctx.fillStyle="rgba(226,240,246,"+a+")";
    ctx.fillRect(Math.round(px-r),wy+1,1,1);
    ctx.fillRect(Math.round(px+r),wy+1,1,1);
    if(r>3){
      ctx.fillStyle="rgba(226,240,246,"+(a*0.5)+")";
      ctx.fillRect(Math.round(px-r*0.6),wy+2,1,1);
      ctx.fillRect(Math.round(px+r*0.6),wy+2,1,1);
    }
  }
  // now and then the swell laps a little harder against it
  // two slow rates beating together, so the harder lap comes irregularly
  var lap=Math.sin(t*0.41+seed*3.7)*0.6+Math.sin(t*0.17+seed*1.9)*0.4;
  if(lap>0.93){
    var f=(lap-0.93)/0.07;
    ctx.fillStyle="rgba(255,255,255,"+(0.34*f)+")";
    ctx.fillRect(px-3,wy-1,7,1);
    ctx.fillStyle="rgba(255,255,255,"+(0.18*f)+")";
    ctx.fillRect(px-1,wy-2,3,1);
  }
}

function drawPier(t, shoreY){
  var x0=LM.pier,y0=EDGE-14;
  var dark=sky.glow>0.5?"#0A1320":"#463A33";
  ctx.fillStyle=dark;
  ctx.fillRect(x0-34,y0,62,3);
  for(var p=0;p<6;p++) ctx.fillRect(x0-30+p*11,y0+3,2,16);
  ctx.fillRect(x0+25,y0-13,2,13);

  // where each pile enters the water. Piles further up the beach sit in the
  // swash rather than the sea, so their collar is smaller.
  var water = shoreY ? null : null;
  for(var q=0;q<6;q++){
    var px=x0-30+q*11+1;
    var wl = shoreY ? Math.min(shoreY(px), EDGE-tide.height*8) : EDGE;
    if(wl > y0+19) continue;                 // this one is on dry sand
    var depth=Math.max(0,Math.min(1,(y0+19-wl)/16));
    drawPileWash(px, wl, t, q*1.7, 0.55+depth*0.6);
  }
  if(sky.glow>0.3){
    var fl=reduced?1:(0.86+0.14*Math.sin(t*3.4)), pu=fl*(1+level*0.8);
    ctx.fillStyle="rgba(255,217,125,"+(0.075*sky.glow*pu)+")"; ctx.fillRect(x0+14,y0-28,25,26);
    ctx.fillStyle="rgba(255,217,125,"+(0.14*sky.glow*pu)+")"; ctx.fillRect(x0+20,y0-22,13,13);
    ctx.fillStyle="#FFD97D"; ctx.fillRect(x0+25,y0-16,2,3);
    ctx.fillStyle="rgba(255,217,125,"+(0.05*sky.glow*pu)+")"; ctx.fillRect(x0+18,y0+3,16,12);
  } else { ctx.fillStyle=dark; ctx.fillRect(x0+25,y0-16,2,3) }
}

var elTime=document.getElementById("time"),elDate=document.getElementById("date"),elSolar=document.getElementById("solar");
var DAYS=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
var MON=["January","February","March","April","May","June","July","August","September","October","November","December"];
var lastPhase="";
function updateClock(){
  var d=new Date(),h=d.getHours(),m=d.getMinutes();
  elTime.textContent=(h<10?"0":"")+h+":"+(m<10?"0":"")+m;
  elDate.textContent=DAYS[d.getDay()]+" "+d.getDate()+" "+MON[d.getMonth()];
  sun=solar(d); updatePalette(sun.alt); updateStars(d);
  var now=h*60+m;
  if(sun.alt>0&&sun.set!==null){
    var left=Math.round(sun.set-now);
    elSolar.textContent=left>90?"Sunset "+hhmm(sun.set):left>0?"Sunset in "+left+" min":"Sunset "+hhmm(sun.set);
  } else if(sun.rise!==null) elSolar.textContent="Sunrise "+hhmm(sun.rise);
  else elSolar.textContent="";
  var phase=sun.alt>6?"day":sun.alt>-0.9?"golden":sun.alt>-6?"dusk":sun.alt>-12?"blue":"night";
  if(lastPhase&&phase!==lastPhase){
    if(phase==="golden") toast("Golden hour");
    else if(phase==="dusk") toast("The sun has set");
    else if(phase==="night"){
      toast("Stars are out &mdash; <b>hover one to identify it</b>");
      if(bioNight) setTimeout(function(){
        toast("The water is glowing tonight &mdash; <b>a plankton bloom</b>",11000) },7000);
    }
    else if(phase==="day") toast("Sunrise");
  }
  var nk=nightKey(d);
  if(nk!==TONIGHT){
    TONIGHT=nk; loadFound(); picked=[]; activeFig=null;
    if(phase==="night"||phase==="blue") toast("A new night &mdash; <b>fresh constellations to find</b>",8000);
  }
  lastPhase=phase;
  updateMoon(d); updateTide(d);
  var tl=document.getElementById("tideline");
  if(tl){
    var arrow = tide.slack ? "" : (tide.rising ? " \u2191" : " \u2193");
    var sp = tide.range>0.82 ? "spring" : tide.range<0.5 ? "neap" : "";
    tl.textContent = tide.state + arrow + (sp?" \u00b7 "+sp:"");
  }
  var vg=document.getElementById("vignette");
  if(vg) vg.style.setProperty("--vig", (0.22+0.55*Math.max(0,Math.min(1,(sun.alt+4)/26))).toFixed(3));
  renderSkyList();
}

// Some stars belong to more than one figure — Alpheratz is a corner of both
// the Great Square and Andromeda. Returning only the first match made the
// other one unreachable, so gather them all.
function figuresOf(i){
  var out=[];
  for(var f=0;f<FIGURES.length;f++)
    if(FIGURES[f].si.indexOf(i)>=0) out.push(FIGURES[f]);
  return out;
}
// Pick the most useful one: not yet traced and fully up, before anything else.
// Clicking the same shared star again steps to the next candidate.
function figureOf(i,after){
  var list=figuresOf(i);
  if(!list.length) return null;
  var ranked=list.slice().sort(function(a,b){
    var sa=(a.found?2:0)+(figureUp(a)?0:1);
    var sb=(b.found?2:0)+(figureUp(b)?0:1);
    return sa-sb;
  });
  if(after){
    var at=ranked.indexOf(after);
    if(at>=0 && ranked.length>1) return ranked[(at+1)%ranked.length];
  }
  return ranked[0];
}
function figureUp(F){
  for(var i=0;i<F.si.length;i++){
    var k=F.si[i];
    if(starPos[k*3+2]<2) return false;              // below the horizon
    if(starPos[k*3]<-2||starPos[k*3]>W+2) return false;   // behind you
  }
  return true;
}
function compass(az){
  var pts=["N","NNE","NE","ENE","E","ESE","SE","SSE","S","SSW","SW","WSW","W","WNW","NW","NNW"];
  return pts[Math.round(((az%360)+360)%360/22.5)%16];
}
function starAzimuth(i){
  // recover azimuth from the stored x projection
  var r=(starPos[i*3]/W-0.5)*FOV;
  return ((facing()+r)%360+360)%360;
}
function renderHover(){
  var box=document.getElementById("starinfo");
  if(hoverStar<0||!starVisible(hoverStar)){ box.classList.remove("on"); return }
  var i=hoverStar, st=STARS[i], alt=starPos[i*3+2];
  var F=figureOf(i);
  var rows="";
  rows+="<div class='sn'>"+st[0]+"</div>";
  rows+="<div class='sr'><span>Magnitude</span><span>"+st[3].toFixed(2)+"</span></div>";
  rows+="<div class='sr'><span>Altitude</span><span>"+alt.toFixed(0)+"&deg;</span></div>";
  rows+="<div class='sr'><span>Bearing</span><span>"+compass(starAzimuth(i))+"</span></div>";
  var all=figuresOf(i);
  if(all.length){
    var names=[];
    for(var q=0;q<all.length;q++) names.push(all[q].name);
    rows+="<div class='sr'><span>Part of</span><span>"+names.join(", ")+"</span></div>";
    var F2=figureOf(i);
    var up=figureUp(F2);
    rows+="<div class='sf'>"+(F2.found ? "Already traced"
        : up ? "Fully above the horizon &mdash; click its stars to trace it"
             : "Part of it is below the horizon tonight")
        +(all.length>1?" &middot; shared between "+all.length+" figures":"")+"</div>";
  }
  box.innerHTML=rows;
  box.classList.add("on");
  var r=cv.getBoundingClientRect();
  var sc=Math.max(r.width/W,r.height/H);
  var px=r.left+(r.width-W*sc)/2+starPos[i*3]*sc;
  var py=r.top+(r.height-H*sc)/2+starPos[i*3+1]*sc;
  box.style.left=Math.min(window.innerWidth-box.offsetWidth-12,Math.max(12,px+16))+"px";
  box.style.top =Math.min(window.innerHeight-box.offsetHeight-12,Math.max(12,py-10))+"px";
}

function renderSkyList(){
  var box=document.getElementById("sky"),list=document.getElementById("skyList");
  if(box.dataset.off==="1"){box.style.display="none";return}
  if(sky.glow<0.45){box.style.display="none";return}
  box.style.display="block";
  var rows=[],n=0;
  for(var f=0;f<FIGURES.length&&n<7;f++){
    var F=FIGURES[f];
    if(!figureUp(F)) continue;
    n++; rows.push(F.found?"<b>"+F.name+"</b>":F.name);
  }
  var done=0, upc=0;
  for(var k=0;k<FIGURES.length;k++){ if(FIGURES[k].found) done++; if(figureUp(FIGURES[k])) upc++ }
  var pts=["north","north-east","east","south-east","south","south-west","west","north-west"];
  var look="Looking "+pts[Math.round(facing()/45)%8];
  var lifetime=parseInt(store.get("tidepool.tracedTotal","0"),10)||0;
  list.innerHTML=rows.join("<br>")+
    "<br><span style='opacity:.6'>"+done+" of "+upc+" tonight"+
    (lifetime>done?" &middot; "+lifetime+" all time":"")+" &middot; "+look+"</span>";
}

// ---- panels: draggable, collapsible, hideable ----------------------
var panels=[].slice.call(document.querySelectorAll(".panel"));
panels.forEach(function(p){
  var id=p.id, hd=p.querySelector(".hd"), fold=p.querySelector(".fold");

  var savedPos=store.get("tidepool.pos."+id,"");
  if(savedPos){
    var parts=savedPos.split(",");
    if(parts.length===2){
      p.style.left=parts[0]+"px"; p.style.top=parts[1]+"px";
      p.style.right="auto"; p.style.bottom="auto";
      p.dataset.moved="1";
    }
  }
  if(store.get("tidepool.fold."+id,"")==="1") p.classList.add("closed");

  if(fold) fold.addEventListener("click",function(e){
    e.stopPropagation();
    p.classList.toggle("closed");
    store.set("tidepool.fold."+id, p.classList.contains("closed")?"1":"0");
    placePanels();
  });

  var drag=null;
  hd.addEventListener("pointerdown",function(e){
    if(e.target.classList.contains("fold")) return;
    var r=p.getBoundingClientRect();
    drag={dx:e.clientX-r.left, dy:e.clientY-r.top};
    p.style.left=r.left+"px"; p.style.top=r.top+"px";
    p.style.right="auto"; p.style.bottom="auto";
    hd.setPointerCapture(e.pointerId);
    e.preventDefault();
  });
  hd.addEventListener("pointermove",function(e){
    if(!drag) return;
    var w=p.offsetWidth, h=p.offsetHeight, SNAP=18;
    var m=Math.round(40*(parseFloat(getComputedStyle(document.documentElement)
          .getPropertyValue("--ui"))||1));
    var nx=Math.max(0,Math.min(window.innerWidth-w, e.clientX-drag.dx));
    var ny=Math.max(0,Math.min(window.innerHeight-h, e.clientY-drag.dy));
    // snap to the standard margins so hand-placed panels still line up
    if(Math.abs(nx-m)<SNAP) nx=m;
    if(Math.abs(nx-(window.innerWidth-w-m))<SNAP) nx=window.innerWidth-w-m;
    if(Math.abs(ny-m)<SNAP) ny=m;
    if(Math.abs(ny-(window.innerHeight-h-m))<SNAP) ny=window.innerHeight-h-m;
    var cx=Math.round((window.innerWidth-w)/2);
    if(Math.abs(nx-cx)<SNAP) nx=cx;
    p.style.left=nx+"px"; p.style.top=ny+"px";
    p.dataset.moved="1";
  });
  hd.addEventListener("pointerup",function(e){
    if(!drag) return;
    drag=null;
    store.set("tidepool.pos."+id, parseInt(p.style.left)+","+parseInt(p.style.top));
    try{hd.releasePointerCapture(e.pointerId)}catch(err){}
  });
});
// On a 4K panel 13px type is unreadable; on a small laptop the panels crowd.
// Scale the whole interface from the viewport height.
function uiScale(){
  var k=Math.max(0.82,Math.min(1.5,(window.innerHeight||1080)/1080));
  document.documentElement.style.setProperty("--ui",k.toFixed(3));
}

// Panels that have not been dragged arrange themselves: the sky panel tucks
// under whatever height the notes panel currently is, with a consistent gap.
function placePanels(){
  var m=Math.round(40*(parseFloat(getComputedStyle(document.documentElement)
        .getPropertyValue("--ui"))||1));
  var notes=document.getElementById("notes"), sky=document.getElementById("sky");
  if(notes && !notes.dataset.moved){
    notes.style.top=m+"px"; notes.style.right=m+"px";
    notes.style.left="auto"; notes.style.bottom="auto";
  }
  if(sky && !sky.dataset.moved){
    var top=m;
    if(notes && notes.style.display!=="none" && notes.offsetHeight)
      top=m+notes.offsetHeight+Math.round(m*0.4);
    sky.style.top=top+"px"; sky.style.right=m+"px";
    sky.style.left="auto"; sky.style.bottom="auto";
  }
  var clock=document.getElementById("clock");
  if(clock && !clock.dataset.moved){
    clock.style.top=m+"px";
    var al=clock.dataset.align||"left";
    if(al==="center"){
      clock.style.left=Math.round((window.innerWidth-clock.offsetWidth)/2)+"px";
      clock.style.right="auto";
    } else if(al==="right"){
      clock.style.right=m+"px"; clock.style.left="auto";
    } else {
      clock.style.left=m+"px"; clock.style.right="auto";
    }
  }
  var stones=document.getElementById("stones");
  if(stones && !stones.dataset.moved){
    stones.style.bottom=m+"px"; stones.style.left=m+"px";
    stones.style.top="auto"; stones.style.right="auto";
  }
  var media=document.getElementById("media");
  if(media && !media.dataset.moved){
    media.style.bottom=m+"px";
    media.style.left=Math.round((window.innerWidth-media.offsetWidth)/2)+"px";
    media.style.top="auto"; media.style.right="auto";
  }
  var col=document.getElementById("colophon");
  if(col){ col.style.bottom=m+"px"; col.style.right=m+"px" }
}

function resetPanels(){
  panels.forEach(function(p){
    store.set("tidepool.pos."+p.id,"");
    delete p.dataset.moved;
    p.style.left=""; p.style.top=""; p.style.right=""; p.style.bottom="";
  });
  placePanels();
  toast("Widgets back where they started");
}

var fill=document.getElementById("chargeFill");
function onUI(el){return el.closest&&el.closest(".panel")!==null}
function toBuf(cx,cy){
  var r=cv.getBoundingClientRect();
  var sc=Math.max(r.width/W,r.height/H);
  return {x:(cx-r.left-(r.width-W*sc)/2)/sc, y:(cy-r.top-(r.height-H*sc)/2)/sc};
}
function nearestStar(bx,by,maxD,onlyFig){
  var bi=-1,bd=maxD*maxD;
  for(var i=0;i<STARS.length;i++){
    if(!starVisible(i)) continue;
    if(onlyFig && onlyFig.si.indexOf(i)<0) continue;
    var dx=starPos[i*3]-bx,dy=starPos[i*3+1]-by,d=dx*dx+dy*dy;
    if(d<bd){bd=d;bi=i}
  }
  return bi;
}
function tryComplete(){
  for(var f=0;f<FIGURES.length;f++){
    var F=FIGURES[f]; if(F.found||picked.length!==F.si.length) continue;
    var all=true;
    for(var i=0;i<F.si.length;i++) if(picked.indexOf(F.si[i])<0){all=false;break}
    if(all){
      F.found=true; saveFound();
      var doneN=0; for(var q2=0;q2<FIGURES.length;q2++) if(FIGURES[q2].found) doneN++;
      var upN=0; for(var q3=0;q3<FIGURES.length;q3++) if(figureUp(FIGURES[q3])) upN++;
      toast("You traced <b>"+F.name+"</b>"+(doneN>=upN?" &mdash; that is all of tonight's":""));
      Snd.chime(81);
      picked=[]; activeFig=null; renderSkyList(); return true;
    }
  }
  return false;
}

window.addEventListener("pointerdown",function(e){

  // shoo a gull: they squeak and climb away

      // the rest of the flock startles too
      for(var gj=0;gj<gulls.length;gj++){

      }

    }
  }
  if(bottle && bottle.landed && Math.abs(b.x-bottle.x)<14 && Math.abs(b.y-bottle.y)<14){
    noteActivity(); return;
  }
  if(b.y<HORIZON && sky.glow>0.45){
    var i=nearestStar(b.x,b.y,8);
    if(i>=0){
      // if this star is shared and we are already on one of its figures,
      // clicking it again offers the next
      var shared=figuresOf(i);
      var fig=(activeFig && shared.length>1 && shared.indexOf(activeFig)>=0 &&
               picked.length<=1)
              ? figureOf(i,activeFig) : figureOf(i);
      if(!fig){ toast("That star is not part of a figure I know"); return }
      if(fig.found){ toast("<b>"+fig.name+"</b> is already traced"); return }
      if(!figureUp(fig)){
        toast("<b>"+fig.name+"</b> is not fully above the horizon tonight");
        return;
      }
      if(activeFig!==fig){
        // starting a new figure: show its shape and how many stars it needs
        activeFig=fig; picked=[i];
        var alsoIn=shared.length>1
          ? " &middot; <span style='opacity:.7'>click again for "+
            figureOf(i,fig).name+"</span>" : "";
        toast("<b>"+fig.name+"</b> &mdash; "+fig.si.length+" stars, follow the rings"+alsoIn);
        return;
      }
      var at=picked.indexOf(i);
      if(at>=0) picked.splice(at,1); else picked.push(i);
      tryComplete();
      return;
    }
    picked=[]; activeFig=null; return;
  }
  charging=true; chargeStart=performance.now();
  var dx0=b.x-walker.x, dy0=b.y-(GROUND-17);
  walker.aim=Math.atan2(Math.min(dy0,-5),dx0);
  walker.dir=dx0<0?-1:1;
});
window.addEventListener("pointerup",function(){
  if(!charging) return;
  charging=false; throwStone(charge); charge=0; fill.style.width="0%";
});
window.addEventListener("keydown",function(e){
  noteActivity();
  if(document.activeElement===pad) return;
  if(e.ctrlKey||e.altKey||e.metaKey) return;      // leave system shortcuts alone
  var used=false;
  if(e.code==="Space"){ if(!charging){charging=true;chargeStart=performance.now()} used=true }
  else if(e.code==="Escape"){ picked=[]; activeFig=null; used=true }
  else if(e.key==="h"||e.key==="H"){ document.body.classList.toggle("zen"); used=true }
  else if(e.key===","||e.key==="<"){ turnView(-45); used=true }
  else if(e.key==="."||e.key===">"){ turnView(45); used=true }
  else if(e.key==="r"||e.key==="R"){ resetPanels(); used=true }
  // swallow it, or the desktop underneath jumps between icons
  if(used){ e.preventDefault(); e.stopPropagation() }
},true);
window.addEventListener("keyup",function(e){
  if(e.code==="Space"&&charging){
    charging=false; throwStone(charge); charge=0; fill.style.width="0%";
    e.preventDefault(); e.stopPropagation();
  }
},true);

// ---- Lively bridge ------------------------------------------------
window.livelyPropertyListener=function(name,val){
  switch(name){
    case "latitude":  var v1=parseFloat(val); if(!isNaN(v1)){LAT=v1;updateClock()} break;
    case "longitude": var v2=parseFloat(val); if(!isNaN(v2)){LON=v2;updateClock()} break;
    case "fpsCap":    TARGET_FPS=val===0?30:60; break;
    case "breakMins": BREAK_MINUTES=Math.max(1,val|0); break;
    case "ambience":  autoSound=!!val; if(val){Snd.wake();Snd.startAmbience()}else{Snd.stopAmbience()} syncBtns(); break;
    case "nocturne":  if(val){Snd.wake();Nocturne.start()}else{Nocturne.stop()} syncBtns(); break;
    case "lofi":      autoLofi=!!val; if(val){Snd.wake();Lofi.start()}else{Lofi.stop()} syncBtns(); break;
    case "showNotes":  document.getElementById("notes").style.display=val?"block":"none"; break;
    case "showStones": document.getElementById("stones").style.display=val?"block":"none"; break;
    case "showMedia":  document.getElementById("media").style.display=val?"block":"none"; break;
    case "showSky":    document.getElementById("sky").dataset.off=val?"":"1"; renderSkyList(); break;
    case "volume":     player.volume=Math.max(0,Math.min(1,val/100));
                       if(Snd.master) Snd.master.gain.value=Math.max(0,Math.min(1,val/100)); break;
    case "viewBearing":
      VIEW = (val===0) ? null : ((val-1)*45);
      store.set("tidepool.view", VIEW===null?"":String(VIEW));
      updateClock(); break;
    case "clockSize":
      document.documentElement.style.setProperty("--clock",(0.6+val/100*1.1).toFixed(2));
      placePanels(); break;
    case "clockAlign":
      var cl=document.getElementById("clock");
      cl.dataset.align = ["left","center","right"][val]||"left";
      delete cl.dataset.moved; store.set("tidepool.pos.clock","");
      cl.style.left=""; cl.style.top=""; cl.style.right="";
      placePanels(); break;
    case "quality":
      // 0 = automatic, otherwise pin it
      if(val===0){ autoQ=true } else { autoQ=false; Q=[1,1,2,3][val]||2; layout() }
      break;
    case "resetLayout": resetPanels(); break;
    case "musicFile":  if(val){playlist=[{name:String(val).replace(/\.[^.]+$/,""),url:"media/"+val}];loadTrack(0)} break;
    case "filmFile":   if(val){film.src="media/"+val;filmReady=true;screenOn=true;syncScr();film.play().catch(function(){})} break;
  }
};
window.livelyAudioListener=function(data){
  if(!data||!data.length) return;
  extAudio=true; extDecay=0.6;
  var s=0,n=Math.min(8,data.length);
  for(var i=0;i<n;i++) s+=data[i];
  level+=(s/n-level)*0.3;
  for(var k=0;k<14;k++) bands[k]+=((data[k+1]||0)-bands[k])*0.35;
};

// ---- loop ---------------------------------------------------------
var errShown=false;
function reportError(err){
  if(errShown) return; errShown=true;
  if(window.console&&console.error) console.error("Tidepool:",err);
  var d=document.createElement("div");
  d.style.cssText="position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:99;"+
    "background:rgba(60,14,14,.92);border:1px solid #C4564A;padding:14px 18px;border-radius:3px;"+
    "font:12px/1.6 monospace;color:#FFD3CD;max-width:560px";
  d.textContent="Scene stopped: "+(err&&err.message?err.message:String(err));
  document.body.appendChild(d);
}

// Watch the real cost of a frame. If the machine cannot keep up, step the
// supersampling down before anything visible starts to stutter, and step it
// back up when there is headroom again.
var frameCost=0, adaptTimer=0, autoQ=true, qFloor=1;
var last=0,acc=0,running=true;
function loop(now){
  if(!running) return;
  requestAnimationFrame(loop);
  if(!last){last=now;return}
  var dt=(now-last)/1000; last=now;
  if(dt>0.25) dt=0.25;
  acc+=dt;
  if(acc<1/TARGET_FPS) return;
  var step=acc; acc=0;
  if(charging){ charge=Math.min(1,(now-chargeStart)/1100); fill.style.width=(charge*100)+"%" }
  readLevel(step); paintEq();
  stepWorld(step); stepWalker(step); stepStones(step); stepSplashes(step);

  var t0=performance.now();
  try{ draw(now/1000) }catch(err){ reportError(err); running=false; return }
  frameCost += ((performance.now()-t0) - frameCost)*0.05;

  if(autoQ){
    adaptTimer+=step;
    if(adaptTimer>3){
      adaptTimer=0;
      var budget=1000/TARGET_FPS*0.55;      // leave over half the frame free
      if(frameCost>budget && Q>qFloor){ Q--; layout(); frameCost=budget*0.6 }
      else if(frameCost<budget*0.35 && Q<3){ Q++; layout(); frameCost=budget*0.6 }
    }
  }
}
document.addEventListener("visibilitychange",function(){
  if(document.hidden){running=false}
  else if(!running&&!errShown){running=true;last=0;requestAnimationFrame(loop)}
});

updateMoon(new Date()); updateTide(new Date());
layout();
window.addEventListener("resize",function(){
  clearTimeout(window.__tpRz);
  window.__tpRz=setTimeout(layout,140);
});
updateClock();
setInterval(updateClock,1000);
syncBtns();
setTimeout(placePanels,60);
var soundAnnounced=false, audioTries=0;

function tryStartSound(fromGesture){
  if(!autoSound) return;
  if(!Snd.boot()) return;
  Snd.wake();
  if(!Snd.ambOn) Snd.startAmbience();
  if(autoLofi && !Lofi.on) Lofi.start();
  syncBtns();
  if(Snd.ctx && Snd.ctx.state==="running" && !soundAnnounced){
    soundAnnounced=true;
    toast("Sea and wind &mdash; <b>all synthesised, no files</b>");
    if(audioNag && audioNag.parentNode) audioNag.parentNode.removeChild(audioNag);
    audioNag=null;
  }
}

// Keep retrying quietly. Some hosts allow audio with no gesture at all;
// others release it the moment the page is touched. Either way we get there.
var audioPoll=setInterval(function(){
  audioTries++;
  if(Snd.ctx && Snd.ctx.state==="running"){
    tryStartSound(false);
    if(soundAnnounced){ clearInterval(audioPoll); audioPoll=null }
    return;
  }
  tryStartSound(false);
  if(audioTries>150){ clearInterval(audioPoll); audioPoll=null }
},2000);

function anyGesture(){ tryStartSound(true) }
["pointerdown","keydown","pointermove","wheel"].forEach(function(ev){
  window.addEventListener(ev,anyGesture,true);
});

// If audio is still blocked after a few seconds, say so plainly rather than
// leaving the user wondering whether it is broken.
var audioNag=null;
setTimeout(function(){
  tryStartSound(false);
  if(!soundAnnounced){
    audioNag=document.createElement("div");
    audioNag.id="audioNag";
    audioNag.innerHTML="Sound is waiting for a click on the wallpaper.<br>"+
      "<span style='opacity:.7'>Desktop icons may be catching it \u2014 try hiding them, "+
      "or press the Ambience button.</span>";
    document.body.appendChild(audioNag);
    audioNag.addEventListener("click",function(){ tryStartSound(true) });
  }
},6000);
setTimeout(function(){ toast("<b>H</b> hides the widgets &mdash; drag any panel by its header") },2400);
requestAnimationFrame(loop);
})();
</script>
