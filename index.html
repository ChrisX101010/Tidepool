var sun={alt:20,az:180,rise:null,set:null}, level=0;

// tiny 3x5 pixel digits, for the score pops
var GLYPH={
  "0":[7,5,5,5,7],"1":[2,6,2,2,7],"2":[7,1,7,4,7],"3":[7,1,7,1,7],"4":[5,5,7,1,1],
  "5":[7,4,7,1,7],"6":[7,4,7,5,7],"7":[7,1,2,2,2],"8":[7,5,7,5,7],"9":[7,5,7,1,7],
  "x":[0,5,2,5,0],"!":[2,2,2,0,2]
};
function pixText(s,x,y,col){
  ctx.fillStyle=col;
  for(var i=0;i<s.length;i++){
    var gl=GLYPH[s[i]]; if(!gl){x+=4;continue}
    for(var r=0;r<5;r++)
      for(var c=0;c<3;c++)
        if(gl[r]&(1<<(2-c))) ctx.fillRect(x+c,y+r,1,1);
    x+=4;
  }
}

var toastBox=document.getElementById("toasts");
function toast(html,ms){
  var el=document.createElement("div"); el.className="toast"; el.innerHTML=html;
  toastBox.appendChild(el);
  requestAnimationFrame(function(){el.classList.add("in")});
  setTimeout(function(){el.classList.remove("in");
    setTimeout(function(){if(el.parentNode)el.parentNode.removeChild(el)},600)},ms||5200);
}

// ===================================================================
// WORLD
// ===================================================================
var ships=[],gulls=[],clouds=[],fireflies=[],meteors=[],pops=[];
var lightPhase=0, bird=null, idleSec=0, breakDue=false;

for(var ci=0;ci<7;ci++) clouds.push({x:Math.random()*W,y:16+Math.random()*66,
  w:34+Math.random()*72,h:6+Math.random()*9,v:0.9+Math.random()*2.2,o:0.05+Math.random()*0.11});

// depth 0 = far out on the horizon, 1 = close inshore.
// Everything about a vessel follows from it: how far down the screen it sits,
// how big it is, and how fast it appears to move.
function spawnShip(kindForce, depthForce){
  var dir=Math.random()<0.5?1:-1;
  var day = sky.glow<0.3;
  // By day: sail and fishing boats inshore, freight on the far horizon.
  // At night nobody fishes, so it is freight and the occasional late motor boat.
  var kind = kindForce || (day
      ? (Math.random()<0.42?"sail":(Math.random()<0.55?"fisher":(Math.random()<0.55?"small":"big")))
      : (Math.random()<0.62?"big":"small"));
  // Freight is enormous and always far out — never inshore. Sail and fishing
  // boats work the near water. This is the whole of the perspective illusion.
  var depth = depthForce!==undefined ? depthForce
            : (kind==="big"    ? Math.random()*0.09
            :  kind==="fisher" ? 0.50+Math.random()*0.42
            :  kind==="sail"   ? 0.34+Math.random()*0.46
            :                    0.26+Math.random()*0.40);
  var sc = 0.42+depth*1.25;
  if(kind==="big") sc=0.30+depth*0.9;
  ships.push({
    x: dir>0 ? -80 : W+80, dir:dir, depth:depth, sc:sc,
    y: HORIZON-4+depth*Math.max(10,(EDGE-HORIZON)*0.62),
    len: Math.max(6,(kind==="big"?92:(kind==="sail"?15:(kind==="fisher"?17:20)))*sc),
    tall: Math.max(3,(kind==="big"?13:(kind==="sail"?17:(kind==="fisher"?7:6)))*sc),
    kind:kind, big:kind==="big",
    v:(kind==="sail"?1.0+Math.random()*1.2:(kind==="fisher"?1.6+Math.random()*1.4:2.2+Math.random()*2.6))*(0.45+depth*1.3)*dir,
    heel:(Math.random()<0.5?-1:1), horned:false, wake:0,
    errand: kind==="fisher" && Math.random()<0.6, phase:"run", wait:0,
    flick:Math.random()*6.28
  });
}
function spawnGull(){
  var dir=Math.random()<0.5?1:-1;
  gulls.push({x:dir>0?-14:W+14, y:34+Math.random()*68, dir:dir,
    v:(15+Math.random()*19)*dir, p:Math.random()*6.28, cried:false,
    state:"glide", dtimer:2.5+Math.random()*7, home:0, glide:Math.random()<0.45});
}
function spawnMeteor(){
  meteors.push({x:40+Math.random()*(W-80),y:8+Math.random()*56,
    vx:40+Math.random()*48,vy:17+Math.random()*23,life:1});
}
function spawnFirefly(){
  fireflies.push({x:24+Math.random()*90,y:GROUND-40+Math.random()*30,
    vx:(Math.random()-.5)*6,vy:(Math.random()-.5)*5,p:Math.random()*6.28,life:4+Math.random()*8});
}
function pop(x,y,txt,col){ pops.push({x:x,y:y,t:txt,life:1,col:col||"#FFD97D"}) }

var timers={ship:5,gull:3,meteor:24,fly:.6,wave:2.5,crab:6,pod:18,whale:420};

// Waves breaking against the headland and the island. Each has its own
// rhythm so the two never pulse together.
var surfSpots=[
  {x:34, y:HORIZON+4, w:66, p:0.0, per:9.4, seed:0.0, mag:0.7, sounded:false},
  {x:452,y:HORIZON+2, w:44, p:4.7, per:13.1,seed:1.9, mag:0.5, sounded:false}
];
var crabs=[], wakes=[], pods=[], whale=null, bottle=null, beachProps=null, prints=[];
var farLights=[], bioNight=false, bioBloom=0;
var wind={base:0.5, gust:0, phase:0, val:0.5};
var buoy={x:286, bob:0, bell:11, flash:0};
var SCRdefault=352;
var washPhase=0, washStrength=0.5;

function stepWorld(dt){
  var night=sky.glow>0.55, day=sky.glow<0.25;

  for(var i=0;i<clouds.length;i++){
    var c=clouds[i]; c.x+=c.v*dt*(reduced?0:(0.5+wind.val*0.85));
    if(c.x-c.w>W){c.x=-c.w;c.y=16+Math.random()*66}
  }

  timers.ship-=dt;
  if(timers.ship<=0){ if(ships.length<3) spawnShip(); timers.ship=34+Math.random()*46 }
  for(var s=ships.length-1;s>=0;s--){
    var S=ships[s];
    if(S.errand){
      // a fishing boat with somewhere to be: out to the island, sit a while,
      // then home again
      if(S.phase==="run"){
        S.x+=S.v*dt;
        if((S.dir>0&&S.x>=LM.island-24)||(S.dir<0&&S.x<=LM.island+24)){
          S.phase="moored"; S.wait=14+Math.random()*26;
        }
      } else if(S.phase==="moored"){
        S.wait-=dt;
        S.x+=Math.sin(washPhase*1.1)*1.2*dt;
        if(S.wait<=0){ S.phase="home"; S.dir=-S.dir; S.v=-S.v }
      } else S.x+=S.v*dt;
    } else S.x+=S.v*dt;
    S.wake+=dt;
    // a trail of disturbed water, laid down behind and slowly healing over
    if(S.phase!=="moored" && S.wake>0.42){
      S.wake=0;
      wakes.push({x:S.x+(S.dir>0?-S.len*0.1:S.len*1.1), y:S.y+Math.max(2,2+S.sc*2),
                  w:Math.max(3,S.len*0.5), life:1, depth:S.depth});
    }
    if(!S.horned && S.big && S.x>W*0.25 && S.x<W*0.75 && Math.random()<dt*0.30){
      S.horned=true; Snd.horn();
    }
    if(S.x<-110||S.x>W+110) ships.splice(s,1);
  }

  if(gullsBanished>0){
    gullsBanished-=dt;
    if(gullsBanished<=0){
      startleRun=0; kindShown=false;
      toast("A gull is back. <b>Give it some peace this time.</b>",8000);
    }
  }
  if(day && gullsBanished<=0){
    timers.gull-=dt;
    if(timers.gull<=0){ if(gulls.length<8) spawnGull(); timers.gull=1.4+Math.random()*4.2 }
  }
  for(var g=gulls.length-1;g>=0;g--){
    var G=gulls[g];
    G.p+=dt*(G.state==="dive"?13:(G.glide?3.4:7.4));
    if(G.state==="glide"){
      G.x+=G.v*dt; G.y+=Math.sin(G.p*0.4)*7*dt;
      G.dtimer-=dt;
      if(G.dtimer<=0 && G.y<HORIZON-10 && G.x>50 && G.x<W-50){
        G.state="dive"; G.home=HORIZON+20+Math.random()*(EDGE-HORIZON-44);
      }
    } else if(G.state==="dive"){
      G.x+=G.v*dt*0.45; G.y+=210*dt;
      if(G.y>=G.home){
        G.state="rise";
        ripples.push({x:G.x,y:G.home,r:0,life:1});
        Snd.splash();
        if(Math.random()<0.5) pop(G.x-2,G.home-12,"!","#EAF2F0");
      }
    } else if(G.state==="flee"){
      G.x+=G.v*dt*2.6; G.y-=95*dt; G.p+=dt*8;
      if(G.y<-14) gulls.splice(g,1);
      continue;
    } else {
      G.x+=G.v*dt; G.y-=120*dt;
      if(G.y<44+Math.random()*20){ G.state="glide"; G.dtimer=18+Math.random()*40 }
    }
    if(!G.cried && G.x>60 && G.x<W-60 && Math.random()<dt*0.55){ G.cried=true; Snd.gull() }
    if(G.x<-26||G.x>W+26) gulls.splice(g,1);
  }

  if(night){
    timers.meteor-=dt;
    if(timers.meteor<=0){ spawnMeteor(); timers.meteor=20+Math.random()*70 }
    timers.fly-=dt;
    if(timers.fly<=0){ if(fireflies.length<16) spawnFirefly(); timers.fly=0.5+Math.random()*1.4 }
  }
  for(var m=meteors.length-1;m>=0;m--){
    var M=meteors[m]; M.x+=M.vx*dt; M.y+=M.vy*dt; M.life-=dt*1.1;
    if(M.life<=0) meteors.splice(m,1);
  }
  for(var q=fireflies.length-1;q>=0;q--){
    var F=fireflies[q];
    F.x+=F.vx*dt; F.y+=F.vy*dt; F.p+=dt*2.6; F.life-=dt;
    F.vx+=(Math.random()-.5)*9*dt; F.vy+=(Math.random()-.5)*8*dt;
    F.vx*=0.99; F.vy*=0.99;
    if(F.life<=0) fireflies.splice(q,1);
  }
  for(var p=pops.length-1;p>=0;p--){
    pops[p].y-=14*dt; pops[p].life-=dt*0.9;
    if(pops[p].life<=0) pops.splice(p,1);
  }

  for(var wk=wakes.length-1;wk>=0;wk--){
    var WK=wakes[wk];
    WK.life-=dt*0.055; WK.w+=dt*3.2;
    if(WK.life<=0) wakes.splice(wk,1);
  }

  // dolphins, and now and then something much larger
  timers.pod-=dt;
  if(timers.pod<=0 && day){
    if(pods.length<2){
      var dir=Math.random()<0.5?1:-1;
      var n=2+Math.floor(Math.random()*2);
      var depth=0.01+Math.random()*0.05;      // right out on the horizon
      var baseY=HORIZON+1+depth*14;
      // stay in the open channel, clear of the headland and the island
      var lo=96, hi=W-96;
      var startX = dir>0 ? lo-24 : hi+24;
      for(var d=0;d<n;d++)
        pods.push({x:startX-dir*d*13, y:baseY, dir:dir, depth:depth,
                   v:(26+Math.random()*12)*dir, phase:Math.random()*3.14, arc:0,
                   period:1.5+Math.random()*0.5, sc:0.55+depth*0.9, blown:false});
    }
    timers.pod=260+Math.random()*420;
  }
  for(var pd=pods.length-1;pd>=0;pd--){
    var P=pods[pd];
    P.x+=P.v*dt; P.phase+=dt*(6.283/P.period);
    var was=P.arc; P.arc=Math.sin(P.phase);
    // a small ring each time it re-enters the water
    if(was>0 && P.arc<=0 && P.x>90 && P.x<W-90)
      ripples.push({x:P.x,y:P.y,r:0,life:0.45});
    if(P.x<96-40||P.x>W-96+40) pods.splice(pd,1);
  }

  timers.whale-=dt;
  if(timers.whale<=0 && !whale && day){
    // far out, only just breaking the horizon, and genuinely rare
    whale={x:Math.random()<0.5?-70:W+70, y:HORIZON+1+Math.random()*4,
           dir:0, v:0, t:0, spout:0, sc:0.42};
    whale.dir=whale.x<0?1:-1; whale.v=9*whale.dir;
  }
  if(timers.whale<=0) timers.whale=2700+Math.random()*4200;
  if(whale){
    whale.x+=whale.v*dt; whale.t+=dt;
    var cyc=(whale.t%16)/16;
    whale.surf = cyc<0.30 ? Math.sin(cyc/0.30*Math.PI) : 0;
    if(cyc>0.05 && cyc<0.10 && whale.spout<=0){ whale.spout=2.6; Snd.whaleBlow() }
    if(whale.spout>0) whale.spout-=dt;
    if(whale.x<-90||whale.x>W+90) whale=null;
  }

  // surf pounding the rocks, on its own timing
  for(var ss=0;ss<surfSpots.length;ss++){
    var SP=surfSpots[ss];
    SP.p+=dt;
    if(SP.p>=SP.per){
      SP.p=0; SP.per=7.5+Math.random()*11; SP.seed=Math.random()*6.28;
      SP.mag=0.35+Math.random()*0.65; SP.sounded=false;
    }
    if(!SP.sounded && SP.p>0.05){
      SP.sounded=true;
      if(Math.random()<0.45) Snd.breakWave(0.12+Math.random()*0.22);
    }
  }

  // the channel buoy: rides the swell, tolls now and then
  var bl=0.45+tide.range*0.5+tide.current*0.4;
  buoy.bob=(Math.sin(washPhase*1.3)*1.5+Math.sin(washPhase*0.7+1.2)*0.9)*bl;
  buoy.flash=(buoy.flash+dt)%4;
  buoy.bell-=dt;
  if(buoy.bell<=0){ Snd.bell(); buoy.bell=22+Math.random()*40 }

  // crabs on the wet sand, daylight only
  if(day){
    timers.crab-=dt;
    if(timers.crab<=0){
      if(crabs.length<4) crabs.push({x:Math.random()*W, y:EDGE+14+Math.random()*(H-EDGE-26),
        dir:Math.random()<0.5?-1:1, state:"still", timer:1+Math.random()*2, p:0});
      timers.crab=5+Math.random()*11;
    }
  } else if(crabs.length && Math.random()<dt*0.4) crabs.pop();
  for(var cb=crabs.length-1;cb>=0;cb--){
    var C=crabs[cb];
    C.timer-=dt; C.p+=dt*13;
    if(C.timer<=0){
      C.state = C.state==="still" ? "run" : "still";
      C.timer = C.state==="run" ? 0.3+Math.random()*0.9 : 1.2+Math.random()*3.4;
      if(C.state==="run" && Math.random()<0.4) C.dir=-C.dir;
    }
    if(C.state==="run"){
      C.x+=C.dir*23*dt;
      if(C.x<6||C.x>W-6){ C.dir=-C.dir; C.x=Math.max(6,Math.min(W-6,C.x)) }
    }
    // a wave coming up the sand sends them scuttling higher, as they do
    var wet=EDGE-tide.height*8+washReach();
    if(C.y < wet+3){
      C.y += 34*dt;
      C.state="run"; C.timer=Math.max(C.timer,0.35);
      if(C.y>H-9) C.y=H-9;
    }
  }

  // waves break on an irregular rhythm, and the sound follows the picture
  washPhase+=dt*(0.20+tide.current*0.24);
  timers.wave-=dt;
  if(timers.wave<=0){
    var size=Math.random();
    washStrength=(0.30+size*0.55)*(0.65+tide.range*0.6);
    Snd.breakWave(size);
    timers.wave=(4.6+Math.random()*5.4)*(tide.slack?1.5:1);
  }

  for(var pf=prints.length-1;pf>=0;pf--){
    prints[pf].life-=dt*0.055;
    if(prints[pf].life<=0) prints.splice(pf,1);
  }

  // Far-off shipping: at this distance you see only a light and a smudge,
  // sliding along the horizon and fading out again.
  if(night){
    if(farLights.length<4 && Math.random()<dt*0.09){
      var fd=Math.random()<0.5?1:-1;
      farLights.push({x:fd>0?-12:W+12, y:HORIZON-1-Math.random()*2.2, dir:fd,
                      v:(1.4+Math.random()*1.6)*fd, life:0, fade:0,
                      hue:Math.random()<0.7?"w":"y", p:Math.random()*6.28});
    }
  }
  for(var fl=farLights.length-1;fl>=0;fl--){
    var FL=farLights[fl];
    FL.x+=FL.v*dt; FL.life+=dt; FL.p+=dt*2.1;
    FL.fade=Math.min(1,FL.life/6);
    if(!night) FL.fade=Math.max(0,FL.fade-dt);
    if(FL.x<-20||FL.x>W+20||(!night&&FL.fade<=0)) farLights.splice(fl,1);
  }

  // A bloom is a property of the night, not the moment: the same night always
  // glows or does not, and it is uncommon.
  var dnow=new Date();
  var nightKey=dnow.getFullYear()*10000+(dnow.getMonth()+1)*100+
               (dnow.getHours()<6?dnow.getDate()-1:dnow.getDate());
  var hsh=(nightKey*2654435761)>>>0;
  bioNight=((hsh%100)<11);          // roughly one night in nine
  var wantBio = (bioNight && night) ? 1 : 0;
  bioBloom += (wantBio-bioBloom)*Math.min(1,dt*0.35);

  // Wind: a slow base with gusts riding on top. Everything flexible uses it.
  wind.phase+=dt*0.19;
  wind.gust=Math.max(0,wind.gust-dt*0.55);
  if(Math.random()<dt*0.06) wind.gust=0.5+Math.random()*0.9;
  wind.base=0.42+0.3*Math.sin(wind.phase)+0.15*Math.sin(wind.phase*2.7);
  wind.val=Math.max(0.05,Math.min(1.8,wind.base+wind.gust));

  // the tally of startled gulls settles down if you leave them be
  if(startleCool>0){ startleCool-=dt; if(startleCool<=0){ startleRun=0; kindShown=false } }

  lightPhase+=dt;

  // break bird
  idleSec+=dt;
  if(!bottle && !bird && idleSec > BREAK_MINUTES*60){
    // something drifts in from out at sea
    var from = walker.x<W/2 ? -20 : W+20;
    bottle={x:from, y:HORIZON+Math.round((EDGE-HORIZON)*0.55), landed:false, t:0,
            tx:walker.x+(walker.dir>0?10:-10), ty:EDGE+3};
    breakDue=true;
  }
  if(bottle){
    bottle.t+=dt;
    if(!bottle.landed){
      var bdx=bottle.tx-bottle.x, bdy=bottle.ty-bottle.y;
      var bd=Math.hypot(bdx,bdy);
      if(bd<2.5){
        bottle.landed=true;
        Snd.chime(72);
        toast("A bottle washed up &mdash; <b>time to rest your eyes?</b>",11000);
      } else {
        bottle.x+=bdx/bd*11*dt; bottle.y+=bdy/bd*11*dt;
      }
    } else if(bottle.t>260) { bottle=null; breakDue=false }
  }
  if(bird){
    bird.p+=dt*8;
    if(!bird.landed){
      var dx=bird.tx-bird.x, dy=bird.ty-bird.y, d=Math.hypot(dx,dy);
      if(d<2){ bird.landed=true } else { bird.x+=dx/d*46*dt; bird.y+=dy/d*46*dt }
    } else {
      bird.stay+=dt;
      if(bird.stay>150) bird=null;
    }
  }
}

function noteActivity(){
  idleSec=0;
  if(bottle && bottle.landed){
    pop(bottle.x-2,bottle.y-12,"!","#EAF2F0");
    bottle=null;
    if(breakDue){ breakDue=false; toast("Welcome back") }
  }
  if(bird){ pop(bird.x,bird.y-8,"!","#EAF2F0"); bird=null }
}

// ===================================================================
// DRAWING
// ===================================================================
function drawClouds(){
  var tint = sky.glow>0.6 ? "234,242,240" : (sun.alt<8 ? "255,190,150" : "255,255,255");
  for(var i=0;i<clouds.length;i++){
    var c=clouds[i];
    ctx.fillStyle="rgba("+tint+","+c.o+")"; ctx.fillRect(c.x|0,c.y|0,c.w|0,c.h|0);
    ctx.fillStyle="rgba("+tint+","+(c.o*0.7)+")";
    ctx.fillRect((c.x+c.w*0.18)|0,(c.y-3)|0,(c.w*0.55)|0,4);
    ctx.fillStyle="rgba("+tint+","+(c.o*0.45)+")";
    ctx.fillRect((c.x+c.w*0.42)|0,(c.y-6)|0,(c.w*0.28)|0,3);
  }
}

// The land masses, as paths. Ships get clipped out of these so nothing —
// hull, light, glow or reflection — can ever appear through solid rock.
function landPath(){
  var ix=LM.island, iy=HORIZON;
  ctx.beginPath();
  // headland
  ctx.moveTo(0,HORIZON+5); ctx.lineTo(0,HORIZON-16);
  ctx.lineTo(13,HORIZON-20); ctx.lineTo(26,HORIZON-13);
  ctx.lineTo(41,HORIZON-5); ctx.lineTo(58,HORIZON); ctx.lineTo(76,HORIZON+5);
  ctx.closePath();
  // island
  ctx.moveTo(ix-31,iy+5); ctx.lineTo(ix-25,iy-3); ctx.lineTo(ix-15,iy-7);
  ctx.lineTo(ix-2,iy-9);  ctx.lineTo(ix+12,iy-7); ctx.lineTo(ix+22,iy-3);
  ctx.lineTo(ix+29,iy+5);
  ctx.closePath();
}

function drawShips(){
  // draw far vessels first so near ones overlap them correctly
  var order=ships.slice().sort(function(p,q){return p.depth-q.depth});
  ctx.save();
  // "everything except the land": even-odd fill of the full frame minus land
  ctx.beginPath();
  ctx.rect(0,0,W,EDGE+2);
  landPath();
  ctx.clip("evenodd");

  for(var i=0;i<order.length;i++){
    var S=order[i];
    var x=Math.round(S.x), y=Math.round(S.y), L=Math.max(4,Math.round(S.len));
    var hullH=Math.max(2,Math.round(2+S.sc*2));
    var wl=y+hullH;
    // haze: distant vessels wash out toward the sky colour
    var haze=1-S.depth*0.55;
    var hull=sky.glow>0.5?"#060B14":"#22303A";
    var deck=sky.glow>0.5?"#0C1521":"#31404A";

    ctx.save(); ctx.globalAlpha=0.55+haze*0.45;

    if(S.kind==="sail"){
      var hy=y+1, lean=S.heel;
      ctx.fillStyle=hull;
      ctx.beginPath();
      ctx.moveTo(x+1,hy); ctx.lineTo(x+L-1,hy);
      ctx.lineTo(x+L-Math.round(L*0.2),wl); ctx.lineTo(x+Math.round(L*0.2),wl);
      ctx.closePath(); ctx.fill();
      var mastX=Math.round(x+L*0.45), mh=Math.round(S.tall);
      var belly=Math.max(0.55,Math.min(1.5,wind.val));
      ctx.fillRect(mastX,hy-mh,1,mh);
      var main = sky.glow>0.5 ? "rgba(186,202,218,0.5)" : "rgba(255,253,246,0.95)";
      var jib  = sky.glow>0.5 ? "rgba(158,176,196,0.38)" : "rgba(234,239,246,0.82)";
      ctx.fillStyle=main;
      ctx.beginPath(); ctx.moveTo(mastX,hy-mh);
      ctx.lineTo(mastX+lean*Math.round(mh*0.52*belly),hy-1); ctx.lineTo(mastX,hy-1);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle=jib;
      ctx.beginPath(); ctx.moveTo(mastX,hy-mh+Math.round(mh*0.22));
      ctx.lineTo(mastX-lean*Math.round(mh*0.30*belly),hy-1); ctx.lineTo(mastX,hy-1);
      ctx.closePath(); ctx.fill();
    } else if(S.kind==="fisher"){
      ctx.fillStyle=hull;
      ctx.beginPath();
      ctx.moveTo(x,y+1); ctx.lineTo(x+L,y+1);
      ctx.lineTo(x+L-Math.round(L*0.16),wl); ctx.lineTo(x+Math.round(L*0.1),wl);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle=sky.glow>0.5?"#123040":"#2F6C7A";
      ctx.fillRect(x+1,y+1,L-2,1);
      var wh=Math.round(x+(S.dir>0?L*0.24:L*0.6));
      ctx.fillStyle=deck;
      ctx.fillRect(wh,y-Math.round(S.tall*0.6),Math.max(2,Math.round(L*0.2)),Math.round(S.tall*0.6)+1);
      ctx.fillRect(Math.round(x+L*0.5),y-Math.round(S.tall),1,Math.round(S.tall));
      if(S.sc>0.9){
        ctx.fillStyle=hull;
        ctx.fillRect(Math.round(x+L*0.5)-3,y-Math.round(S.tall)+1,7,1);   // spreader
      }
      if(S.phase==="moored"){
        ctx.fillStyle="rgba(234,242,240,0.22)";
        ctx.fillRect(x-2,wl,L+4,1);
      }
    } else {
      ctx.fillStyle=hull;
      ctx.beginPath();
      ctx.moveTo(x+1,y); ctx.lineTo(x+L,y); ctx.lineTo(x+L-1,wl); ctx.lineTo(x+2,wl);
      ctx.closePath(); ctx.fill();
      if(S.big){
        ctx.fillStyle=deck;
        var sx2=S.dir>0 ? x+L-Math.round(L*0.34) : x+Math.round(L*0.1);
        var sh=Math.round(S.tall*0.8);
        ctx.fillRect(sx2,y-sh,Math.round(L*0.24),sh);
        ctx.fillRect(sx2+2,y-sh-Math.round(S.tall*0.35),Math.max(2,Math.round(L*0.1)),Math.round(S.tall*0.4));
        ctx.fillStyle=hull;
        for(var k=0;k<3;k++) ctx.fillRect(x+3+k*Math.round(L*0.17),y-2,Math.round(L*0.14),2);
      } else {
        ctx.fillStyle=deck;
        var cx2=Math.round(S.dir>0?x+L*0.5:x+L*0.3);
        ctx.fillRect(cx2,y-Math.round(S.tall*0.7),Math.max(2,Math.round(L*0.2)),Math.round(S.tall*0.7));
      }
    }
    ctx.restore();

    // reflection: shorter and fainter the further away it is
    var rl=Math.max(1,Math.round(2+S.depth*4));
    for(var r=0;r<rl;r++){
      var ry=wl+1+r; if(ry>EDGE-3) break;
      var jit=Math.sin(S.x*0.3+r*1.7+performance.now()/900)*(1+S.depth*2);
      ctx.fillStyle="rgba(10,16,26,"+((sky.glow>0.5?0.26:0.15)*(1-r/rl))+")";
      ctx.fillRect(Math.round(x+r+jit),ry,Math.max(2,L-r*2),1);
    }
    // wake, only worth drawing when near enough to see
    if(S.depth>0.25 && S.phase!=="moored"){
      ctx.fillStyle="rgba(234,242,240,"+(0.10*S.depth+0.04)+")";
      var bow=S.dir>0?x+L-2:x;
      ctx.fillRect(bow-(S.dir>0?Math.round(L*0.3):0),wl,Math.round(L*0.4),1);
      var stern=S.dir>0?x-Math.round(L*0.4):x+L;
      ctx.fillStyle="rgba(234,242,240,"+(0.06*S.depth)+")";
      ctx.fillRect(stern,wl,Math.round(L*0.5),1);
    }

    if(sky.glow>0.35 && S.kind!=="sail"){
      S.flick=(S.flick||0)+0.09;
      var fk=0.82+0.13*Math.sin(S.flick*1.7)+0.05*Math.sin(S.flick*5.3);
      var a=sky.glow*(0.6+S.depth*0.4)*fk;
      ctx.fillStyle="rgba(255,246,215,"+(0.95*a)+")";
      ctx.fillRect(Math.round(x+L*0.5),y-Math.round(S.tall)-1,1,1);
      ctx.fillStyle="rgba(255,74,74,"+(0.9*a)+")";
      ctx.fillRect(S.dir>0?x+1:x+L-2,y-1,1,1);
      ctx.fillStyle="rgba(74,255,128,"+(0.9*a)+")";
      ctx.fillRect(S.dir>0?x+L-2:x+1,y-1,1,1);
      for(var q=0;q<2;q++){
        var gy=wl+1+q*2; if(gy>EDGE-3) break;
        ctx.fillStyle="rgba(255,240,200,"+(0.09*a*(1-q/2))+")";
        ctx.fillRect(Math.round(x+L*0.5-2+Math.sin(performance.now()/700+q)*2),gy,4,1);
      }
    }
    if(S.kind==="sail" && sky.glow>0.4){
      ctx.fillStyle="rgba(255,255,255,"+(0.8*sky.glow)+")";
      ctx.fillRect(Math.round(x+L*0.45),y-Math.round(S.tall)-1,1,1);
    }
  }
  ctx.restore();
}

function drawGulls(){
  for(var i=0;i<gulls.length;i++){
    var g=gulls[i], x=g.x|0, y=g.y|0;
    ctx.fillStyle= g.y<HORIZON ? "rgba(250,252,255,0.82)" : "rgba(28,38,48,0.62)";
    if(g.state==="dive"){
      // wings tucked, falling like a dart
      ctx.fillRect(x,y,2,4);
      ctx.fillRect(x-1,y+1,1,2); ctx.fillRect(x+2,y+1,1,2);
    } else if(g.glide && g.state==="glide"){
      // held wings, barely moving
      ctx.fillRect(x-4,y,3,1); ctx.fillRect(x+2,y,3,1); ctx.fillRect(x-1,y,3,1);
    } else {
      var up=Math.sin(g.p)>0;
      if(up){ ctx.fillRect(x-3,y,2,1); ctx.fillRect(x+2,y,2,1); ctx.fillRect(x-1,y+1,3,1) }
      else  { ctx.fillRect(x-3,y+2,2,1); ctx.fillRect(x+2,y+2,2,1); ctx.fillRect(x-1,y,3,1) }
    }
  }
}

// Wakes: long healing scars on the water where a hull has passed.
// The moon: a disc with the maria roughly where they actually are, lit from
// the sun's side, with the true phase for tonight. It should be recognisable
// as the moon, not a large star.
function moonPhase(d){
  // days since a known new moon, over the synodic month
  var syn=29.530588853;
  var days=(d.getTime()/86400000)-6.8576;   // 2000-01-06 18:14 UTC new moon
  var age=((days%syn)+syn)%syn;
  return age/syn;                            // 0 new, .5 full, 1 new again
}
var MARIA=[
  [-3,-3,3,2],[0,-4,2,2],[2,-1,3,3],[-4,1,3,2],[-1,2,2,2],[3,3,2,2],[-5,-1,2,2]
];
function drawMoon(mx,my){
  mx=Math.round(mx); my=Math.round(my);
  var R=9;
  var ph=moonPhase(new Date());
  var illum=Math.abs(Math.cos(ph*Math.PI*2))*0;  // placeholder, replaced below
  // fraction lit, and which limb is lit
  var k=(1-Math.cos(ph*2*Math.PI))/2;            // 0 new .. 1 full
  var waxing = ph<0.5;

  // the glow, scaled by how much of it is lit
  var GR=Math.round(16+18*k);
  var mg=ctx.createRadialGradient(mx,my,0,mx,my,GR);
  mg.addColorStop(0,   "rgba(214,228,248,"+(0.06+0.20*k)+")");
  mg.addColorStop(0.28,"rgba(206,222,246,"+(0.03+0.09*k)+")");
  mg.addColorStop(1,   "rgba(200,218,244,0)");
  ctx.fillStyle=mg; ctx.fillRect(mx-GR,my-GR,GR*2,GR*2);

  // disc
  ctx.fillStyle="rgba(233,238,246,0.97)";
  ctx.beginPath(); ctx.arc(mx,my,R,0,6.2832); ctx.fill();

  // maria — the dark basalt plains, which is what makes it read as the moon
  ctx.save();
  ctx.beginPath(); ctx.arc(mx,my,R-0.5,0,6.2832); ctx.clip();
  ctx.fillStyle="rgba(168,180,198,0.85)";
  for(var i=0;i<MARIA.length;i++){
    var M=MARIA[i];
    ctx.fillRect(mx+M[0],my+M[1],M[2],M[3]);
  }
  ctx.fillStyle="rgba(150,163,184,0.7)";
  ctx.fillRect(mx-2,my-2,2,2); ctx.fillRect(mx+4,my+1,2,1);
  // a couple of bright rays from a young crater
  ctx.fillStyle="rgba(248,250,255,0.75)";
  ctx.fillRect(mx-1,my+5,1,3); ctx.fillRect(mx+2,my+5,1,2);
  ctx.restore();

  // The terminator is an ellipse, not an offset circle. Its projected
  // semi-axis is a = R*(1-2k): positive when a crescent (the shadow bulges
  // across the disc) and negative when gibbous (a thin bite at one limb).
  // Waxing is lit on the right, so the shadow sits on the left, and waning
  // is the mirror of that.
  if(k<0.985){
    var a=R*(1-2*k);
    for(var yy=-R;yy<=R;yy++){
      var halfW=Math.sqrt(Math.max(0,R*R-yy*yy));
      if(halfW<0.5) continue;
      var xt=a*Math.sqrt(Math.max(0,1-(yy*yy)/(R*R)));   // terminator at this row
      var x0,x1;
      if(waxing){ x0=-halfW; x1=xt }                      // shadow on the left
      else       { x0=-xt;   x1=halfW }                   // shadow on the right
      if(x1<=x0) continue;
      ctx.fillStyle=sky.top;
      ctx.fillRect(Math.round(mx+x0),my+yy,Math.max(1,Math.round(x1-x0)),1);
      // earthshine: the unlit disc is faintly visible, lit by the Earth
      ctx.fillStyle="rgba(150,172,206,"+(0.055+0.05*(1-k))+")";
      ctx.fillRect(Math.round(mx+x0),my+yy,Math.max(1,Math.round(x1-x0)),1);
    }
    // a soft edge along the terminator itself, so it is not a hard cut
    ctx.fillStyle="rgba(190,205,228,0.30)";
    for(var ey=-R;ey<=R;ey+=1){
      var hw=Math.sqrt(Math.max(0,R*R-ey*ey));
      if(hw<0.5) continue;
      var ex=a*Math.sqrt(Math.max(0,1-(ey*ey)/(R*R)));
      if(Math.abs(ex)>hw) continue;
      ctx.fillRect(Math.round(mx+ex),my+ey,1,1);
    }
  }
}

function drawFarLights(){
  ctx.save();
  ctx.beginPath(); ctx.rect(0,0,W,EDGE+2); landPath(); ctx.clip("evenodd");
  for(var i=0;i<farLights.length;i++){
    var F=farLights[i];
    var flick=0.75+0.25*Math.sin(F.p*3.1)+0.08*Math.sin(F.p*11);
    var a=F.fade*flick*sky.glow;
    if(a<=0.01) continue;
    var col=F.hue==="w"?"255,246,220":"255,214,150";
    // the hull is only a smudge at this distance
    ctx.fillStyle="rgba(30,44,58,"+(F.fade*0.34)+")";
    ctx.fillRect(Math.round(F.x)-3,Math.round(F.y),7,1);
    ctx.fillStyle="rgba("+col+","+(a*0.16)+")";
    ctx.fillRect(Math.round(F.x)-4,Math.round(F.y)-4,9,9);
    ctx.fillStyle="rgba("+col+","+a+")";
    ctx.fillRect(Math.round(F.x),Math.round(F.y)-1,1,1);
    ctx.fillStyle="rgba("+col+","+(a*0.22)+")";
    ctx.fillRect(Math.round(F.x)-1,Math.round(F.y)+1,3,1);
  }
  ctx.restore();
}

function drawWakes(){
  ctx.save();
  ctx.beginPath(); ctx.rect(0,0,W,EDGE+2); landPath(); ctx.clip("evenodd");
  for(var i=0;i<wakes.length;i++){
    var K=wakes[i], a=K.life*K.life;
    if(K.y>EDGE-3) continue;
    if(bioBloom>0.05){
      ctx.fillStyle="rgba(100,240,228,"+(0.22*a*bioBloom)+")";
      ctx.fillRect(Math.round(K.x-K.w/2),Math.round(K.y),Math.round(K.w),1);
    }
    ctx.fillStyle="rgba(234,242,240,"+(0.13*a*(0.4+K.depth*0.6))+")";
    ctx.fillRect(Math.round(K.x-K.w/2),Math.round(K.y),Math.round(K.w),1);
    ctx.fillStyle="rgba(234,242,240,"+(0.06*a)+")";
    ctx.fillRect(Math.round(K.x-K.w*0.7),Math.round(K.y+1),Math.round(K.w*1.4),1);
  }
  ctx.restore();
}

// Dolphins arcing through the horizon line, so it is not just a flat edge.
function drawPods(){
  for(var i=0;i<pods.length;i++){
    var P=pods[i];
    if(P.arc<=0) continue;                       // below the surface
    var a=P.arc, x=Math.round(P.x), sc=P.sc;
    var lift=Math.round(a*7*sc);
    var y=Math.round(P.y-lift);
    var L=Math.max(3,Math.round(8*sc));
    ctx.globalAlpha=0.55+P.depth*0.45;
    ctx.fillStyle=sky.glow>0.5?"#0B1622":"#22333F";
    // back
    ctx.fillRect(x,y,L,Math.max(1,Math.round(2*sc)));
    // dorsal fin at the top of the arc
    if(a>0.45) ctx.fillRect(x+Math.round(L*0.45),y-Math.max(1,Math.round(2*sc)),1,Math.max(1,Math.round(2*sc)));
    // snout leading, tail trailing
    if(a>0.25){
      ctx.fillRect(P.dir>0?x+L:x-1,y-(a>0.7?1:0),1,1);
      ctx.fillRect(P.dir>0?x-1:x+L,y+1,1,1);
    }
    ctx.globalAlpha=1;
    // the water parting as it breaks and re-enters — small, at this distance
    if(a>0.05&&a<0.34){
      var f=1-Math.abs(a-0.19)/0.15;
      ctx.fillStyle="rgba(255,255,255,"+(0.42*f)+")";
      ctx.fillRect(x-1,Math.round(P.y),L+2,1);
      ctx.fillStyle="rgba(255,255,255,"+(0.20*f)+")";
      ctx.fillRect(x-2,Math.round(P.y)-1,2,1);
      ctx.fillRect(x+L,Math.round(P.y)-1,2,1);
    }
  }
}

// Once in a long while, something bigger.
function drawWhale(){
  if(!whale||!whale.surf) return;
  var a=whale.surf, x=Math.round(whale.x), y=Math.round(whale.y-a*4);
  ctx.globalAlpha=0.8;
  ctx.fillStyle=sky.glow>0.5?"#0A141F":"#1E2E39";
  var L=Math.round((24*a+8)*whale.sc);
  ctx.fillRect(x,y,L,Math.max(1,Math.round(3*a)));
  ctx.fillRect(x+Math.round(L*0.2),y-1,Math.round(L*0.5),1);
  if(a>0.6){
    ctx.fillRect(x+Math.round(L*0.62),y-2,2,2);            // small dorsal
    ctx.fillRect(whale.dir>0?x-4:x+L+1,y-2,4,3);           // fluke as it rolls
  }
  ctx.globalAlpha=1;
  ctx.fillStyle="rgba(255,255,255,"+(0.34*a)+")";
  ctx.fillRect(x-2,Math.round(whale.y+1),L+4,1);
  if(whale.spout>0){
    var sp=Math.min(1,whale.spout/2.6);
    var bx=x+Math.round(L*0.18), h=Math.round(11*sp);
    ctx.fillStyle="rgba(255,255,255,"+(0.5*sp)+")";
    ctx.fillRect(bx,y-h,1,h);
    ctx.fillStyle="rgba(255,255,255,"+(0.3*sp)+")";
    ctx.fillRect(bx-2,y-h-2,2,3); ctx.fillRect(bx+1,y-h-3,2,3);
    ctx.fillRect(bx-3,y-h+2,1,2); ctx.fillRect(bx+3,y-h+1,1,2);
  }
}

// Static beach dressing, generated once so it never crawls about.
function buildBeach(){
  var seed=91177;
  function rnd(){ seed=(seed*1103515245+12345)&0x7fffffff; return seed/0x7fffffff }
  beachProps={shells:[],wood:[],wrack:[],rocks:[]};
  for(var i=0;i<26;i++)
    beachProps.shells.push({x:rnd()*W, y:EDGE+9+rnd()*(H-EDGE-16), k:Math.floor(rnd()*3)});
  for(var j=0;j<3;j++)
    beachProps.wood.push({x:40+rnd()*(W-90), y:EDGE+16+rnd()*(H-EDGE-26),
                          w:9+rnd()*16, a:rnd()<0.5?0:1});
  for(var k=0;k<60;k++)
    beachProps.wrack.push({x:rnd()*W, o:0.3+rnd()*0.5, d:rnd()*6});
  for(var m=0;m<9;m++)
    beachProps.rocks.push({x:rnd()*W, y:EDGE+6+rnd()*10, s:1+Math.floor(rnd()*2)});
  // a rowing boat pulled up out of the water
  beachProps.boat={x:Math.round(W*0.72), y:EDGE+22};
}

function drawBeachDetail(t, shoreY){
  if(!beachProps||beachProps.W!==W){ buildBeach(); beachProps.W=W }
  var night=sky.glow>0.5;

  // wrack line: dried weed left by the last high tide
  for(var i=0;i<beachProps.wrack.length;i++){
    var w=beachProps.wrack[i];
    var y=shoreY(w.x)+9+w.d;
    ctx.fillStyle= night ? "rgba(14,20,28,"+(w.o*0.5)+")" : "rgba(86,72,44,"+(w.o*0.42)+")";
    ctx.fillRect(w.x|0,y|0,2,1);
  }
  // pebbles
  for(var r=0;r<beachProps.rocks.length;r++){
    var rk=beachProps.rocks[r];
    ctx.fillStyle= night ? "#181F2A" : "#8B7C63";
    ctx.fillRect(rk.x|0,rk.y|0,rk.s+1,rk.s);
    ctx.fillStyle= night ? "#222B38" : "#A6957A";
    ctx.fillRect(rk.x|0,rk.y|0,1,1);
  }
  // shells
  for(var sI=0;sI<beachProps.shells.length;sI++){
    var sh=beachProps.shells[sI];
    ctx.fillStyle= night ? "rgba(150,164,180,0.5)" : "rgba(252,246,236,0.92)";
    if(sh.k===0){ ctx.fillRect(sh.x|0,sh.y|0,2,1); ctx.fillRect((sh.x+0.5)|0,(sh.y-1)|0,1,1) }
    else if(sh.k===1){ ctx.fillRect(sh.x|0,sh.y|0,1,2) }
    else { ctx.fillRect(sh.x|0,sh.y|0,2,2);
           ctx.fillStyle=night?"rgba(90,104,120,0.5)":"rgba(226,208,186,0.9)";
           ctx.fillRect(sh.x|0,sh.y|0,1,1) }
  }

  // footprints the walker has left
  for(var fI=0;fI<prints.length;fI++){
    var pr=prints[fI];
    ctx.fillStyle="rgba(0,0,0,"+(0.16*pr.life)+")";
    ctx.fillRect(pr.x|0,pr.y|0,2,1);

  }
}

// Anything that stands proud of the sand is drawn AFTER the swash, so the
// water runs around it rather than over it — and gets a collar of foam where
// the two meet, which is what sells it.
function drawBeachStanding(t, shoreY){
  if(!beachProps) return;
  var night=sky.glow>0.5;
  var reach=washReach();
  var wetTo=function(x){ return shoreY(x)+reach };   // how far the water is up

  // driftwood
  for(var dI=0;dI<beachProps.wood.length;dI++){
    var wd=beachProps.wood[dI];
    var submerged = wetTo(wd.x) > wd.y;
    ctx.fillStyle="rgba(0,0,0,0.10)";
    ctx.fillRect(wd.x|0,(wd.y+2)|0,(wd.w+2)|0,1);
    ctx.fillStyle= night ? "#121922" : (submerged?"#4E3B2C":"#6B5340");
    ctx.fillRect(wd.x|0,wd.y|0,wd.w|0,2);
    ctx.fillRect((wd.x+wd.w*0.3)|0,(wd.y-1)|0,3,1);
    if(submerged){
      // water piling against the upstream side, and foam either end
      ctx.fillStyle="rgba(255,255,255,0.42)";
      ctx.fillRect(wd.x|0,(wd.y-1)|0,wd.w|0,1);
      ctx.fillStyle="rgba(255,255,255,0.26)";
      ctx.fillRect((wd.x-2)|0,wd.y|0,2,2);
      ctx.fillRect((wd.x+wd.w)|0,wd.y|0,2,2);
    }
  }

  // the beached rowing boat
  var b=beachProps.boat, bsub = wetTo(b.x) > b.y+2;
  ctx.fillStyle="rgba(0,0,0,0.13)";
  ctx.fillRect(b.x-13,b.y+3,28,2);
  ctx.fillStyle= night ? "#111A25" : (bsub?"#4A392C":"#5E4A3C");
  ctx.beginPath();
  ctx.moveTo(b.x-13,b.y-3); ctx.lineTo(b.x+14,b.y-3);
  ctx.lineTo(b.x+10,b.y+3); ctx.lineTo(b.x-9,b.y+3);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle= night ? "#1B2734" : "#8A6E56";
  ctx.fillRect(b.x-11,b.y-3,23,1);
  ctx.fillStyle= night ? "#111A25" : "#4A3A2E";
  ctx.fillRect(b.x-3,b.y-2,2,4);
  ctx.fillRect(b.x-18,b.y-1,7,1);                      // oar leaning out
  if(bsub){
    // the sea washing round her hull
    ctx.fillStyle="rgba(255,255,255,0.45)";
    ctx.fillRect(b.x-14,(b.y+3)|0,29,1);
    ctx.fillStyle="rgba(255,255,255,0.28)";
    ctx.fillRect(b.x-16,(b.y+1)|0,3,3);
    ctx.fillRect(b.x+14,(b.y+1)|0,3,3);
    ctx.fillStyle="rgba(160,204,214,0.22)";
    ctx.fillRect(b.x-13,(b.y+4)|0,27,2);
  }
}

// The rest reminder: a bottle rides in on the swell and grounds near him.
function drawBottle(t, shoreY){
  if(!bottle) return;
  var x=Math.round(bottle.x), y=Math.round(bottle.y+Math.sin(washPhase*1.6)*(bottle.landed?0.4:1.8));
  var night=sky.glow>0.5;
  ctx.fillStyle="rgba(0,0,0,0.12)";
  ctx.fillRect(x-3,y+3,8,1);
  ctx.fillStyle= night ? "rgba(120,190,175,0.85)" : "rgba(122,186,160,0.95)";
  ctx.fillRect(x-3,y,7,3);                       // body
  ctx.fillRect(x+4,y+1,2,1);                     // neck
  ctx.fillStyle="#C9A66B";
  ctx.fillRect(x+6,y+1,1,1);                     // cork
  ctx.fillStyle="rgba(250,246,232,0.95)";
  ctx.fillRect(x-2,y+1,3,1);                     // the note inside
  ctx.fillStyle="rgba(255,255,255,0.5)";
  ctx.fillRect(x-3,y,7,1);                       // highlight
  if(bottle.landed){
    var pulse=0.4+0.35*Math.sin(t*2.6);
    ctx.fillStyle="rgba(255,217,125,"+(pulse*0.3)+")";
    ctx.fillRect(x-7,y-5,16,13);
  }
}

function drawCrabs(t){
  var wet=EDGE-tide.height*8+washReach();
  for(var i=0;i<crabs.length;i++){
    var C=crabs[i], x=C.x|0, y=C.y|0;
    ctx.fillStyle="rgba(0,0,0,0.13)"; ctx.fillRect(x-2,y+2,6,1);
    if(C.y<wet+2){                       // ankle-deep, so foam breaks on it
      ctx.fillStyle="rgba(255,255,255,0.34)";
      ctx.fillRect(x-2,y+1,6,1);
    }
    ctx.fillStyle=sky.glow>0.5?"#2A1E1C":"#8C4A38";
    ctx.fillRect(x-1,y,4,2);
    ctx.fillRect(x-2,y-1,1,1); ctx.fillRect(x+3,y-1,1,1);   // claws
    var lift=(C.state==="run"&&Math.sin(C.p)>0)?1:0;
    ctx.fillRect(x-2,y+2-lift,1,1); ctx.fillRect(x+3,y+1+lift,1,1);
    ctx.fillStyle=sky.glow>0.5?"#3A2A26":"#F0D8CC";
    ctx.fillRect(x,y,1,1);
  }
}

// A mooring pole with a small boat tied to it, and two smaller marker buoys.
// Enough to read as a working stretch of water without cluttering it.
function drawMoorings(t){
  var night=sky.glow>0.5;
  var dark=night?"#0A1320":"#4A3A2E";
  var px=Math.round(W*0.70);
  var waterY=EDGE-tide.height*8;
  var floatY=Math.round(waterY)-9;        // where she would float
  var groundY=EDGE-7;                     // where the seabed stops her
  var aground=floatY>groundY;
  var py=aground?groundY:floatY;
  // A moored boat barely moves. It lifts on the swell and settles, and the
  // motion scales with the tidal range — almost still at neaps and slack
  // water, livelier on a spring flood. It is not a river.
  // Once she is on the bottom she stops moving. That is the whole difference
  // between a boat afloat and a boat aground, and it is what was missing.
  var lively=aground?0:(0.35+tide.range*0.5+tide.current*0.45);
  if(sky.glow>0.5) lively*=1.25;                 // choppier after dark
  var bobA=(Math.sin(washPhase*1.15)*0.9+Math.sin(washPhase*0.47+1.3)*0.5)*lively;
  var bobB=(Math.sin(washPhase*1.15+1.1)*0.8+Math.sin(washPhase*0.6)*0.4)*lively;
  // aground she leans over on her bilge, which is what boats do
  var heel=aground?1.6:Math.sin(washPhase*1.15+0.4)*lively*0.6;

  // the pole
  ctx.fillStyle=dark;
  ctx.fillRect(px,py-15,2,20);
  ctx.fillRect(px-1,py-17,4,2);
  ctx.fillStyle="rgba(10,16,26,0.20)";
  ctx.fillRect(px-1,py+5,4,3);
  drawPileWash(px+1, py+5, t, 4.2, 1.0);

  // ---- the moored boat, drawn big enough to actually read ----------
  var bx2=px-24, by2=py-1+bobA, byr=Math.round(by2);
  var hl=Math.round(heel);

  if(aground){
    // wet sand where the water has just left her, and a shadow instead of
    // a reflection
    ctx.fillStyle="rgba(0,0,0,0.14)";
    ctx.fillRect(bx2-14,byr+6,30,2);
    ctx.fillStyle="rgba(60,72,66,0.16)";
    ctx.fillRect(bx2-16,byr+5,34,4);
    // a shallow pool trapped under her
    ctx.fillStyle="rgba(150,190,200,0.13)";
    ctx.fillRect(bx2-9,byr+5,19,1);
  } else {
    // its reflection, broken by the surface
    ctx.fillStyle="rgba(10,16,26,0.22)";
    for(var rr2=0;rr2<3;rr2++)
      ctx.fillRect(bx2-11+Math.round(Math.sin(washPhase*2+rr2)*1.5),byr+6+rr2,22-rr2*4,1);
  }

  // hull: dark below the rubbing strake, pale topsides
  ctx.fillStyle=night?"#0B1420":"#4A3A2C";
  ctx.beginPath();
  ctx.moveTo(bx2-13+hl,byr);      ctx.lineTo(bx2+13+hl,byr);
  ctx.lineTo(bx2+10,byr+6);       ctx.lineTo(bx2-9,byr+6);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle=night?"#1B2836":"#C8B79C";       // topsides catch the light
  ctx.fillRect(bx2-12+hl,byr,25,2);
  ctx.fillStyle=night?"#0E1926":"#7E5E42";       // rubbing strake
  ctx.fillRect(bx2-12+hl,byr+2,25,1);
  ctx.fillStyle=night?"#08111B":"#33261C";       // sheer and stem
  ctx.fillRect(bx2+12+hl,byr-1,2,3);
  ctx.fillRect(bx2-14+hl,byr-1,2,3);
  // thwarts and a small cabin
  ctx.fillStyle=night?"#101D2A":"#8A6B4C";
  ctx.fillRect(bx2-6+hl,byr-4,9,4);
  ctx.fillStyle=night?"#050C14":"#2A2018";
  ctx.fillRect(bx2-4+hl,byr-3,5,2);              // the dark of the doorway
  // mast, raked slightly with the heel
  ctx.fillStyle=night?"#0B1420":"#3E3126";
  ctx.fillRect(bx2+5+hl,byr-13,1,13);
  ctx.fillRect(bx2+3+hl,byr-13,5,1);
  // fenders over the side
  ctx.fillStyle=night?"#16222E":"#9A8262";
  ctx.fillRect(bx2+8,byr+2,1,2); ctx.fillRect(bx2-8,byr+2,1,2);

  // the mooring line: slack when she is sitting on the bottom
  ctx.strokeStyle=night?"rgba(150,172,192,0.34)":"rgba(64,52,40,0.62)";
  ctx.lineWidth=1; ctx.beginPath();
  ctx.moveTo(bx2+13+hl,byr+1);
  ctx.quadraticCurveTo((bx2+13+px)/2,byr+(aground?9:5)+bobA*0.5,px,py-13);
  ctx.stroke();

  // a lamp aboard, and its long reflection
  if(night){
    ctx.fillStyle="rgba(255,228,160,0.09)"; ctx.fillRect(bx2-8+hl,byr-14,17,17);
    ctx.fillStyle="rgba(255,228,160,0.17)"; ctx.fillRect(bx2-3+hl,byr-9,8,8);
    ctx.fillStyle="rgba(255,236,180,0.95)"; ctx.fillRect(bx2+1+hl,byr-6,1,2);
    for(var lr=0;lr<4;lr++){
      ctx.fillStyle="rgba(255,228,160,"+(0.13-lr*0.03)+")";
      ctx.fillRect(bx2+Math.round(Math.sin(washPhase*2.2+lr)*2),byr+6+lr*2,3,1);
    }
  }
  // water breaking against her at night, or on a big spring tide —
  // but only while she is actually in it
  if(!aground && (night||tide.range>0.85) && Math.sin(washPhase*1.15)>0.72){
    var sl=(Math.sin(washPhase*1.15)-0.72)/0.28;
    ctx.fillStyle="rgba(255,255,255,"+(0.42*sl)+")";
    ctx.fillRect(bx2-15+hl,byr+3,5,1);
    ctx.fillStyle="rgba(255,255,255,"+(0.26*sl)+")";
    ctx.fillRect(bx2-16+hl,byr+2,3,1); ctx.fillRect(bx2+12+hl,byr+3,4,1);
  }

  // two small marker buoys further out
  var marks=[[Math.round(W*0.58),HORIZON+26,bobB,"g"],[Math.round(W*0.79),HORIZON+33,bobA*0.85,"r"]];
  for(var m=0;m<marks.length;m++){
    var MX=marks[m][0], MY=Math.round(marks[m][1]+marks[m][2]);
    ctx.fillStyle="rgba(10,16,26,0.16)"; ctx.fillRect(MX-1,MY+3,3,2);
    ctx.fillStyle=night?"#0D1721":"#2E4148";
    ctx.fillRect(MX-1,MY,3,3); ctx.fillRect(MX,MY-3,1,3);
    ctx.fillStyle= marks[m][3]==="g" ? (night?"#153322":"#3E8C55") : (night?"#33161A":"#B2453B");
    ctx.fillRect(MX-1,MY,3,1);
    if(night){
      var fl=((buoy.flash+m*1.3)%4)<0.5;
      if(fl){
        var cc=marks[m][3]==="g"?"90,255,150":"255,100,90";
        ctx.fillStyle="rgba("+cc+",0.16)"; ctx.fillRect(MX-4,MY-7,9,9);
        ctx.fillStyle="rgba("+cc+",0.9)";  ctx.fillRect(MX,MY-3,1,1);
      }
    }
    ctx.fillStyle="rgba(234,242,240,0.13)"; ctx.fillRect(MX-2,MY+3,5,1);
  }
}

function drawBuoy(t){
  var bx=buoy.x, by=HORIZON+38-tide.height*3+buoy.bob;
  var dark=sky.glow>0.5?"#0C1520":"#2E4148";
  // reflection first
  ctx.fillStyle="rgba(10,16,26,0.18)";
  ctx.fillRect(bx-1,(by+5)|0,4,3);
  ctx.fillStyle=dark;
  ctx.fillRect(bx-2,(by)|0,6,5);
  ctx.fillStyle=sky.glow>0.5?"#3A1D1D":"#C2453A";
  ctx.fillRect(bx-2,(by+1)|0,6,2);
  ctx.fillStyle=dark;
  ctx.fillRect(bx,(by-6)|0,1,6);
  ctx.fillRect(bx-1,(by-8)|0,3,2);
  var on = (buoy.flash<0.55);
  if(sky.glow>0.3 && on){
    ctx.fillStyle="rgba(255,90,80,"+(0.20*sky.glow)+")"; ctx.fillRect(bx-6,(by-14)|0,13,13);
    ctx.fillStyle="rgba(255,120,100,"+(0.9*sky.glow)+")"; ctx.fillRect(bx,(by-8)|0,1,1);
  }
  // it sits in a little collar of disturbed water
  ctx.fillStyle="rgba(234,242,240,0.16)";
  ctx.fillRect(bx-4,(by+4)|0,9,1);
}

// Surf smashing into the headland and the island rocks.
function drawRockSurf(t){
  for(var i=0;i<surfSpots.length;i++){
    var SP=surfSpots[i], p=SP.p, mag=SP.mag||0.6;
    // rise and decay both vary with the size of the break
    var riseT=0.18+mag*0.22, fallT=1.3+mag*1.8;
    var k = p<riseT ? p/riseT : Math.max(0, 1-(p-riseT)/fallT);
    if(k<=0.02) continue;
    var e=k*k*(0.45+mag*0.85);
    var sd=SP.seed;
    // the wash across the rock foot, with its own irregular profile
    for(var x=-SP.w/2;x<SP.w/2;x+=2){
      var fx=SP.x+x;
      if(fx<-2||fx>W+2) continue;
      var edge=Math.sin(x*0.19+sd)*1.6+Math.sin(x*0.07-sd*1.7)*1.3+Math.sin(x*0.41+sd*2.3)*0.7;
      // the wash reads as a moving film: soft at the edges, denser in the
      // middle, and it thins toward the ends of the break
      var lump=0.45+0.55*Math.sin(x*0.3+sd*3.1);
      var along=1-Math.pow(Math.abs(x)/(SP.w/2),1.7);
      var h=Math.max(1,Math.round(e*2.2*lump*along+0.4));
      ctx.fillStyle="rgba(255,255,255,"+(0.20*e*(0.5+lump*0.5)*along)+")";
      ctx.fillRect(fx|0,(SP.y+edge-1)|0,2,h);
      ctx.fillStyle="rgba(214,238,244,"+(0.13*e*along)+")";
      ctx.fillRect(fx|0,(SP.y+edge)|0,2,1);
    }
    // plumes: count, position, height and lean all differ per break
    var plumes=2+Math.floor((Math.sin(sd*5.1)*0.5+0.5)*4);
    for(var q=0;q<plumes;q++){
      var frac=(q+0.5)/plumes;
      var jitter=Math.sin(sd*7.3+q*2.9);
      var pxp=SP.x+(frac-0.5)*SP.w*0.9+jitter*4;
      var peak=(1.4+Math.abs(Math.sin(sd*3.7+q*1.9))*3.0)*e*1.9*mag;
      var hh=Math.max(1,Math.round(peak));
      var lean=Math.round(jitter*wind.val*1.4);
      for(var yy=0;yy<hh;yy++){
        var g=yy/hh;
        // fades as it rises, so the plume dissolves instead of stopping dead
        ctx.fillStyle="rgba(255,255,255,"+(0.20*e*(1-g*0.8))+")";
        ctx.fillRect(Math.round(pxp+lean*g),(SP.y-yy)|0,g>0.55?1:2,1);
      }
      // droplets flung clear at the top of the plume
      if(e>0.35){
        var dn=1+Math.floor(Math.abs(Math.sin(sd*11+q))*3);
        for(var dI=0;dI<dn;dI++){
          var dxp=pxp+lean+ (dI-1)*2 + Math.sin(sd*13+q+dI)*3;
          var dyp=SP.y-hh-1-dI*2-Math.round(e*3);
          ctx.fillStyle="rgba(255,255,255,"+(0.15*e*(1-dI*0.3))+")";
          ctx.fillRect(dxp|0,dyp|0,1,1);
        }
      }
    }
    // backwash draining off the rocks as it collapses
    if(p>riseT+0.25 && e>0.10){
      var bw=(p-riseT-0.25)/fallT;
      for(var bx2=-SP.w/2;bx2<SP.w/2;bx2+=3){
        var n2=Math.sin(bx2*0.5+sd*4);
        if(n2<0.1) continue;
        ctx.fillStyle="rgba(226,242,246,"+(0.10*e*n2)+")";
        ctx.fillRect((SP.x+bx2)|0,(SP.y+1+bw*3)|0,2,1);
      }
    }
  }
}

// Cloud shadows crossing the water. Only when the sun is high enough to cast.
function drawCloudShadows(){
  if(sun.alt<12) return;
  var off=(180-sun.az)*0.25;
  for(var i=0;i<clouds.length;i++){
    var c=clouds[i];
    var sxp=c.x+off, syp=HORIZON+8+(c.y*0.28);
    if(syp>EDGE-6) continue;
    ctx.fillStyle="rgba(6,26,38,"+(c.o*1.5)+")";
    ctx.fillRect(sxp|0,syp|0,(c.w*1.25)|0,(3+c.h*0.35)|0);
  }
}

function drawBird(){
  if(!bird) return;
  var x=bird.x|0, y=bird.y|0;
  var col=sky.glow>0.5?"#0D1622":"#33231C";
  ctx.fillStyle="rgba(255,217,125,0.10)"; ctx.fillRect(x-7,y-7,15,15);
  ctx.fillStyle=col;
  ctx.fillRect(x-2,y-4,5,4);       // body
  ctx.fillRect(x+2,y-6,3,3);       // head
  ctx.fillRect(x+5,y-5,2,1);       // beak
  if(bird.landed){
    ctx.fillRect(x-1,y,1,2); ctx.fillRect(x+1,y,1,2);
    var t=Math.sin(bird.p*0.35);
    if(t>0.7) ctx.fillRect(x-4,y-4,3,2);
  } else {
    var f=Math.sin(bird.p)>0;
    if(f){ ctx.fillRect(x-5,y-7,4,2) } else { ctx.fillRect(x-5,y-2,4,2) }
  }
  ctx.fillStyle="#FFD97D"; ctx.fillRect(x+3,y-6,1,1);
}

function drawMeteors(){
  ctx.lineWidth=1;
  for(var i=0;i<meteors.length;i++){
    var m=meteors[i];
    ctx.strokeStyle="rgba(234,242,240,"+(Math.min(1,m.life)*0.9)+")";
    ctx.beginPath(); ctx.moveTo(m.x,m.y);
    ctx.lineTo(m.x-m.vx*0.28,m.y-m.vy*0.28); ctx.stroke();
  }
}

function drawFireflies(){
  for(var i=0;i<fireflies.length;i++){
    var f=fireflies[i];
    var b=(0.35+0.65*Math.max(0,Math.sin(f.p)))*Math.min(1,f.life);
    ctx.fillStyle="rgba(190,255,140,"+(b*0.12)+")"; ctx.fillRect((f.x-3)|0,(f.y-3)|0,7,7);
    ctx.fillStyle="rgba(215,255,170,"+b+")"; ctx.fillRect(f.x|0,f.y|0,1,1);
  }
}

function drawPops(){
  for(var i=0;i<pops.length;i++){
    var p=pops[i], a=Math.min(1,p.life);
    var col=p.col==="#FFD97D" ? "rgba(255,217,125,"+a+")" : "rgba(234,242,240,"+a+")";
    pixText(p.t, p.x|0, p.y|0, col);
  }
}

var picked=[], hoverStar=-1, activeFig=null;
function starVisible(i){
  return starPos[i*3+2]>1.5 && sky.glow>0.45 &&
         starPos[i*3]>=-2 && starPos[i*3]<=W+2;
}
function starAlpha(i){
  var a=Math.max(0.18,Math.min(1,(5.2-STARS[i][3])/4.6));
  var ext=Math.min(1,Math.max(0,starPos[i*3+2]/16));
  return a*(0.35+0.65*ext)*sky.glow;
}
function drawStars(t){
  if(sky.glow<0.2) return;
  var i;
  for(var f=0;f<FIGURES.length;f++){
    var F=FIGURES[f]; if(!F.found) continue;
    var vis=true;
    for(i=0;i<F.si.length;i++) if(!starVisible(F.si[i])){vis=false;break}
    if(!vis) continue;
    ctx.strokeStyle="rgba(111,211,199,"+(0.18*sky.glow)+")"; ctx.lineWidth=1; ctx.beginPath();
    for(i=0;i<F.li.length;i++){
      var pr=F.li[i];
      ctx.moveTo(starPos[pr[0]*3]+0.5,starPos[pr[0]*3+1]+0.5);
      ctx.lineTo(starPos[pr[1]*3]+0.5,starPos[pr[1]*3+1]+0.5);
    }
    ctx.stroke();
  }
  // Once you pick a star, the figure it belongs to reveals itself: the
  // remaining stars are ringed and the lines you still need are ghosted in,
  // so it is a puzzle with an answer rather than joining dots at random.
  if(activeFig && !activeFig.found){
    var AF=activeFig;
    ctx.save();
    ctx.setLineDash([2,3]);
    ctx.strokeStyle="rgba(255,217,125,"+(0.26*sky.glow)+")"; ctx.lineWidth=1;
    ctx.beginPath();
    for(i=0;i<AF.li.length;i++){
      var L2=AF.li[i];
      if(picked.indexOf(L2[0])>=0 && picked.indexOf(L2[1])>=0) continue;
      ctx.moveTo(starPos[L2[0]*3]+0.5,starPos[L2[0]*3+1]+0.5);
      ctx.lineTo(starPos[L2[1]*3]+0.5,starPos[L2[1]*3+1]+0.5);
    }
    ctx.stroke();
    ctx.restore();
    // ring the stars still to find
    for(i=0;i<AF.si.length;i++){
      var sidx=AF.si[i];
      if(picked.indexOf(sidx)>=0) continue;
      var rx=Math.round(starPos[sidx*3]), ry=Math.round(starPos[sidx*3+1]);
      var pulse=0.30+0.16*Math.sin(t*2.4+i);
      ctx.strokeStyle="rgba(255,217,125,"+(pulse*sky.glow)+")"; ctx.lineWidth=1;
      ctx.beginPath(); ctx.arc(rx+0.5,ry+0.5,4,0,6.2832); ctx.stroke();
    }
    // solid lines for the pairs you have joined
    ctx.strokeStyle="rgba(255,217,125,"+(0.7*sky.glow)+")"; ctx.lineWidth=1;
    ctx.beginPath();
    for(i=0;i<AF.li.length;i++){
      var L3=AF.li[i];
      if(picked.indexOf(L3[0])<0 || picked.indexOf(L3[1])<0) continue;
      ctx.moveTo(starPos[L3[0]*3]+0.5,starPos[L3[0]*3+1]+0.5);
      ctx.lineTo(starPos[L3[1]*3]+0.5,starPos[L3[1]*3+1]+0.5);
    }
    ctx.stroke();
  }
  for(i=0;i<STARS.length;i++){
    if(!starVisible(i)) continue;
    var fx=starPos[i*3], fy=starPos[i*3+1];
    var x=Math.round(fx), y=Math.round(fy);
    if(x<-6||x>W+6) continue;
    var mag=STARS[i][3];
    // two scintillation rates beating against each other, so no star pulses
    // in step with its neighbour
    var tw=reduced?1:(0.78+0.14*Math.sin(t*1.7+i*1.7)+0.08*Math.sin(t*4.3+i*0.9));
    var a=starAlpha(i)*tw;
    var on=picked.indexOf(i)>=0, hov=(i===hoverStar);
    var bright=mag<1.6, mid=mag<2.8;

    // soft halo, centred on the star, falling off radially
    if(bright||mid){
      var GR=bright?7:4.5;
      var hg=ctx.createRadialGradient(x+0.5,y+0.5,0,x+0.5,y+0.5,GR);
      hg.addColorStop(0,"rgba(226,238,255,"+(a*0.42)+")");
      hg.addColorStop(0.4,"rgba(214,230,255,"+(a*0.13)+")");
      hg.addColorStop(1,"rgba(200,222,255,0)");
      ctx.fillStyle=hg;
      ctx.fillRect(x-GR,y-GR,GR*2+1,GR*2+1);
    }
    // selection and hover rings, drawn as circles not squares
    if(on||hov){
      ctx.strokeStyle=on?"rgba(255,217,125,0.75)":"rgba(226,238,255,0.45)";
      ctx.lineWidth=1;
      ctx.beginPath(); ctx.arc(x+0.5,y+0.5,on?5:4,0,6.2832); ctx.stroke();
    }
    // the star itself: one pixel for faint, a plus-shape for the brightest
    ctx.fillStyle=on?"rgba(255,224,150,1)":"rgba(244,249,255,"+Math.min(1,a*1.15)+")";
    ctx.fillRect(x,y,1,1);
    if(mid && a>0.42){
      ctx.fillStyle=on?"rgba(255,224,150,0.55)":"rgba(240,247,255,"+(a*0.45)+")";
      ctx.fillRect(x+1,y,1,1);
    }
    if(bright){
      // Real scintillation is the star momentarily brightening and shifting
      // colour, not growing spikes. Keep the spikes to a single faint pixel
      // either side, and let the twinkle live in brightness and hue.
      var sp=a*0.30;
      ctx.fillStyle="rgba(228,240,255,"+sp+")";
      ctx.fillRect(x-1,y,1,1); ctx.fillRect(x+1,y,1,1);
      ctx.fillRect(x,y-1,1,1); ctx.fillRect(x,y+1,1,1);
      if(!reduced){
        // three incommensurate rates: brightness wanders, never repeats
        var sc1=Math.sin(t*2.7+i*2.3), sc2=Math.sin(t*6.1+i*1.1), sc3=Math.sin(t*11.3+i*0.7);
        var flash=(sc1*0.5+sc2*0.3+sc3*0.2);
        if(flash>0.72){
          var f=(flash-0.72)/0.28;
          // atmospheric refraction splits the colour slightly as it flickers
          var hue = sc2>0 ? "198,222,255" : "255,238,214";
          ctx.fillStyle="rgba("+hue+","+(f*0.55*a)+")";
          ctx.fillRect(x,y,1,1);
          ctx.fillStyle="rgba("+hue+","+(f*0.16*a)+")";
          ctx.fillRect(x-1,y-1,3,3);
        }
      }
    }
  }
}

// ---- walker -------------------------------------------------------
var walker={x:200,dir:1,state:"walk",timer:2,step:0,aim:-0.9};
function stepWalker(dt){
  if(charging){ walker.state="aim"; return }
  if(walker.state==="aim") walker.state="idle", walker.timer=1.5;
  walker.timer-=dt;
  if(walker.timer<=0){
    if(walker.state==="walk"){walker.state="idle";walker.timer=2+Math.random()*6}
    else{walker.state="walk";walker.dir=Math.random()<.5?-1:1;walker.timer=3+Math.random()*8}
  }
  if(walker.state==="walk"){
    var was=walker.step;
    walker.x+=walker.dir*15*dt; walker.step+=dt*6.5;
    if(Math.floor(was/3.14)!==Math.floor(walker.step/3.14)){
      prints.push({x:walker.x+(Math.sin(walker.step)>0?1:-2), y:GROUND+1, life:1});
      if(prints.length>34) prints.shift();
    }
    if(walker.x<LM.walkMin){walker.x=LM.walkMin;walker.dir=1}
    if(walker.x>LM.walkMax){walker.x=LM.walkMax;walker.dir=-1}
  }
}
function drawWalker(){
  var x=Math.round(walker.x), y=GROUND;
  var bob=walker.state==="walk"?Math.round(Math.sin(walker.step)*0.5):0;
  var col=sky.glow>0.5?"#0A1018":"#39312C";
  // long shadow on the sand
  var sunScreenX = projAz(sun.az);
  var shDir = sun.alt>0 ? (sunScreenX<x?1:-1) : 1;
  var shLen = sun.alt>0 ? Math.round(4+Math.max(0,(30-sun.alt))*0.55) : 5;
  ctx.fillStyle="rgba(0,0,0,"+(sky.glow>0.5?0.20:0.17)+")";
  ctx.fillRect(shDir>0?x-2:x-shLen, y+1, shLen+4, 2);
  ctx.fillStyle=col;
  ctx.fillRect(x-1,y-14+bob,3,4);                 // head
  ctx.fillRect(x-2,y-10+bob,5,7);                 // torso
  // a wide-brimmed hat: warm leather by day, a silhouette after dark
  var hatCol = sky.glow>0.5 ? "#0A1018" : "#6B4526";
  var hatTop = sky.glow>0.5 ? "#0A1018" : "#7C5430";
  ctx.fillStyle=hatCol;
  ctx.fillRect(x-3,y-15+bob,7,1);                 // brim
  ctx.fillStyle=hatTop;
  ctx.fillRect(x-1,y-17+bob,3,2);                 // crown
  ctx.fillStyle= sky.glow>0.5 ? "#0A1018" : "#4A2F1B";
  ctx.fillRect(x-1,y-15+bob,3,1);                 // band
  ctx.fillStyle=col;
  if(walker.state==="aim"){
    ctx.fillRect(x-3,y-3,3,3); ctx.fillRect(x+1,y-3,3,3);
    var ax=Math.cos(walker.aim)*5, ay=Math.sin(walker.aim)*5;
    ctx.fillRect((x+ax)|0,(y-9+ay)|0,2,2);        // cocked arm
  } else if(walker.state==="walk"){
    var sw=Math.sin(walker.step)>0?1:-1;
    ctx.fillRect(x-2,y-3,2,3); ctx.fillRect(x+sw,y-3,2,3);
  } else { ctx.fillRect(x-2,y-3,2,3); ctx.fillRect(x+1,y-3,2,3) }
  if(sky.glow>0.4){
    var lx=x+walker.dir*4, ly=y-8, p=1+level*0.7;
    ctx.fillStyle="rgba(255,217,125,"+(0.085*sky.glow*p)+")"; ctx.fillRect(lx-9,ly-9,19,19);
    ctx.fillStyle="rgba(255,217,125,"+(0.14*sky.glow*p)+")"; ctx.fillRect(lx-4,ly-4,9,9);
    ctx.fillStyle="#FFD97D"; ctx.fillRect(lx,ly,1,2);
  }
}

// ---- stones -------------------------------------------------------
var stones=[],ripples=[],splashes=[],charging=false,chargeStart=0,charge=0;
var best=parseInt(store.get("tidepool.best","0"),10)||0;
var startled=parseInt(store.get("tidepool.startled","0"),10)||0;
var startleRun=0, startleCool=0, kindShown=false;
var gullsBanished=0;      // seconds until they trust the beach again
document.getElementById("best").textContent=best;
document.getElementById("startled").textContent=startled;
var mouseB={x:240,y:120};

function throwStone(p){
  var sp=70+p*205;
  var surf=EDGE-tide.height*8-3;
  var hy=Math.min(GROUND-20, surf-7);          // hand is always above the water
  stones.push({x:walker.x+Math.cos(walker.aim)*6, y:hy+Math.sin(walker.aim)*4,
    vx:Math.cos(walker.aim)*sp, vy:Math.sin(walker.aim)*sp,
    skips:0, launched:false, sunk:false, age:0, x0:walker.x});
}
function stepStones(dt){
  for(var i=stones.length-1;i>=0;i--){
    var s=stones[i];
    s.x+=s.vx*dt; s.y+=s.vy*dt; s.vy+=200*dt;
    s.age+=dt;
    if(!s.launched && (s.age>0.05 || Math.abs(s.x-s.x0)>7)) s.launched=true;

    // a stone can startle a gull flying low enough to reach. Nothing is hurt —
    // they squawk and climb away — but it should not become the point.
    if(s.launched && !s.hitBird){
      for(var gb=0;gb<gulls.length;gb++){
        var GB=gulls[gb];
        if(GB.state==="flee") continue;
        if(Math.abs(s.x-GB.x)<5 && Math.abs(s.y-GB.y)<5){
          s.hitBird=true;
          GB.state="flee"; Snd.squeak();
          pop(GB.x-2,GB.y-10,"!","#EAF2F0");
          for(var g3=0;g3<gulls.length;g3++){
            var G3=gulls[g3];
            if(G3!==GB && Math.abs(G3.x-GB.x)<80 && Math.random()<0.8) G3.state="flee";
          }
          startled++; store.set("tidepool.startled",String(startled));
          document.getElementById("startled").textContent=startled;
          startleRun++; startleCool=30;
          if(startleRun===1) toast("You startled a gull &mdash; <b>"+startled+" so far</b>");
          else if(startleRun===3 && !kindShown){
            kindShown=true;
            toast("They are only after breakfast. <b>Be kind, even to the noisy ones.</b>",9000);
          }
          else if(startleRun>=5 && gullsBanished<=0){
            // they have had enough. The whole flock goes, and the beach is
            // quiet for a while — which is the point.
            for(var g4=0;g4<gulls.length;g4++) gulls[g4].state="flee";
            gullsBanished=240;
            Snd.chime(52);
            toast("They have gone. <b>Are you happy now?</b>",11000);
            setTimeout(function(){
              toast("The beach is quieter without them.",9000) },13000);
          }
          break;
        }
      }
    }
    var surfY=EDGE-tide.height*8-3;
    if(s.y>=surfY && s.vy>0 && s.launched){
      // Angle of attack decides everything. A stone arriving almost flat
      // planes off the surface and keeps nearly all its speed; one coming
      // down steeply punches through and sinks. This is why a low, fast
      // throw skips a dozen times and a lob skips twice.
      var speed=Math.hypot(s.vx,s.vy);
      var ang=Math.atan2(Math.abs(s.vy),Math.abs(s.vx))*DEG;

      if(ang>34 || speed<40){
        // too steep, or too slow to plane: it goes in, and throws water up
        s.sunk=true;
        var pw=Math.min(1.0, Math.min(1.1,speed/230)*(0.5+Math.min(1,ang/70)*0.62));
        makeSplash(s.x,surfY,pw,s.vx);
        ripples.push({x:s.x,y:surfY,r:0,life:1});
        ripples.push({x:s.x,y:surfY,r:3,life:0.7});
        Snd.sink(pw);
        if(s.skips===0) pop(s.x-4,surfY-15,"0","#8FA6AD");
        finish(s.skips); stones.splice(i,1); continue;
      }

      s.skips++;
      ripples.push({x:s.x,y:surfY,r:0,life:1});
      Snd.plop(Math.min(1,Math.abs(s.vy)/150));
      pop(s.x-3, surfY-12, String(s.skips), s.skips>=6?"#EAF2F0":"#FFD97D");

      // restitution falls off with the angle: 0.86 flat, 0.30 at the limit
      // 0.84 rebound arriving flat, falling to 0.28 at the sinking limit
      var e=Math.max(0.28,0.84-(ang/34)*0.56);
      s.vy=-s.vy*e;
      s.vx*=0.978-(ang/34)*0.05;       // skimming costs forward speed
      // each successive skip robs a little more, so a run always ends
      s.vy*=(1-Math.min(0.45,s.skips*0.028));
      if(Math.abs(s.vy)<9||Math.abs(s.vx)<30){
        makeSplash(s.x,surfY,0.30,s.vx*0.4);
        Snd.sink(0.3);
        finish(s.skips); stones.splice(i,1); continue;
      }
    }
    if(s.x<-16||s.x>W+16||s.y>H+16){finish(s.skips);stones.splice(i,1)}
  }
  for(var j=ripples.length-1;j>=0;j--){
    ripples[j].r+=24*dt; ripples[j].life-=dt*0.85;
    if(ripples[j].life<=0) ripples.splice(j,1);
  }
}
function finish(n){
  var el=document.getElementById("last");
  if(n===0){ el.textContent="sank"; return }
  el.textContent=n+(n===1?" skip":" skips");
  if(n>best){
    best=n; document.getElementById("best").textContent=best;
document.getElementById("startled").textContent=startled;
    store.set("tidepool.best",String(best));
    if(n>=5){
      toast("New best &mdash; <b>"+n+" skips</b>"+(n>=12?" &mdash; that was a good one":""));
      Snd.chime(n>=12?83:76);
    }
  }
}
// A stone going in deep throws a column of water up after it, which then
// falls back. Bigger and steeper impacts throw it higher. Each splash is
// independent, so a handful thrown at once all plume separately.
function makeSplash(x,y,power,vx){
  var drops=[];
  power=Math.max(0.15,Math.min(1.0,power));
  var n=3+Math.round(power*8);
  for(var d=0;d<n;d++){
    var a=(-0.35-Math.random()*2.45);            // mostly upward, fanned
    var sp=(22+Math.random()*40)*power;
    drops.push({x:x, y:y, vx:Math.cos(a)*sp+vx*0.10, vy:Math.sin(a)*sp,
                life:1, sz:Math.random()<0.3?2:1});
  }
  power=Math.max(0.15,Math.min(1.0,power));
  splashes.push({x:x, y:y, p:power, t:0, life:1, drops:drops,
                 crown:0.4+Math.random()*0.35});
}

function stepSplashes(dt){
  for(var i=splashes.length-1;i>=0;i--){
    var S=splashes[i];
    S.t+=dt; S.life-=dt*0.85;
    for(var d=S.drops.length-1;d>=0;d--){
      var D=S.drops[d];
      D.x+=D.vx*dt; D.y+=D.vy*dt; D.vy+=185*dt; D.life-=dt*0.75;
      if(D.y>=S.y && D.vy>0){
        // it falls back in and leaves a small ring of its own
        if(D.life>0.3 && Math.random()<0.5)
          ripples.push({x:D.x,y:S.y,r:0,life:0.35});
        S.drops.splice(d,1); continue;
      }
      if(D.life<=0) S.drops.splice(d,1);
    }
    if(S.life<=0 && S.drops.length===0) splashes.splice(i,1);
  }
}

function drawSplashes(){
  var bio=bioBloom>0.05;
  for(var i=0;i<splashes.length;i++){
    var S=splashes[i], t=S.t, p=S.p;
    var white = bio ? "170,255,246" : "255,255,255";
    var pale  = bio ? "120,240,228"  : "226,240,246";

    // the central column: shoots up fast, hangs, falls back
    var up=0.11+p*0.07, down=0.30+p*0.22;
    var h=0;
    if(t<up) h=(t/up)*(3.5+p*10);
    else if(t<up+down) h=(1-(t-up)/down)*(3.5+p*10);
    if(h>0.5){
      var col=Math.max(1,Math.round(h));
      var wdt=Math.max(1,Math.round(3*p*(1-t/(up+down))));
      for(var yy=0;yy<col;yy++){
        var g=yy/col;
        var ww=Math.max(1,Math.round(wdt*(1-g*0.7)));
        ctx.fillStyle="rgba("+white+","+(0.55*(1-g*0.45)*Math.min(1,S.life*1.6))+")";
        ctx.fillRect(Math.round(S.x-ww/2),Math.round(S.y-yy),ww,1);
      }
      // the tip breaks into droplets as it slows
      if(t>up*0.7){
        ctx.fillStyle="rgba("+white+","+(0.4*S.life)+")";
        ctx.fillRect(Math.round(S.x-1),Math.round(S.y-col-1),1,1);
        ctx.fillRect(Math.round(S.x+1),Math.round(S.y-col-2),1,1);
      }
    }

    // the crown: a low collar of water thrown out sideways at the moment of entry
    if(t<0.30){
      var cr=(t/0.30);
      var spread=Math.round(2+p*9*cr);
      var ch=Math.max(1,Math.round((1-cr)*(1.5+p*3)));
      for(var sx2=-spread;sx2<=spread;sx2+=2){
        var edge=1-Math.abs(sx2)/(spread+1);
        if(edge<0.15) continue;
        ctx.fillStyle="rgba("+white+","+(0.42*(1-cr)*edge)+")";
        ctx.fillRect(Math.round(S.x+sx2),Math.round(S.y-ch*edge),2,Math.max(1,Math.round(ch*edge)));
      }
    }

    // droplets arcing out and falling back
    for(var d=0;d<S.drops.length;d++){
      var D=S.drops[d];
      ctx.fillStyle="rgba("+pale+","+(0.75*Math.min(1,D.life))+")";
      ctx.fillRect(Math.round(D.x),Math.round(D.y),D.sz,D.sz);
      if(D.sz>1){
        ctx.fillStyle="rgba("+white+","+(0.3*D.life)+")";
        ctx.fillRect(Math.round(D.x),Math.round(D.y)-1,1,1);
      }
    }

    // the hole it left in the surface, closing over
    if(t<0.45){
      var k=1-t/0.45;
      ctx.fillStyle="rgba(10,22,32,"+(0.34*k*p)+")";
      ctx.fillRect(Math.round(S.x-2*p),Math.round(S.y),Math.max(1,Math.round(4*p)),1);
    }
  }
}

function drawStones(){
  for(var i=0;i<ripples.length;i++){
    var r=ripples[i];
    if(bioBloom>0.05){
      ctx.fillStyle="rgba(110,248,232,"+(r.life*0.7*bioBloom)+")";
      ctx.fillRect((r.x-r.r)|0,r.y|0,(r.r*2)|0,1);
      ctx.fillStyle="rgba(110,248,232,"+(r.life*0.16*bioBloom)+")";
      ctx.fillRect((r.x-r.r)|0,(r.y-2)|0,(r.r*2)|0,5);
    }
    ctx.fillStyle="rgba(234,242,240,"+(r.life*0.38*(1-bioBloom*0.6))+")";
    ctx.fillRect((r.x-r.r)|0,r.y|0,(r.r*2)|0,1);
    ctx.fillStyle="rgba(234,242,240,"+(r.life*0.18)+")";
    ctx.fillRect((r.x-r.r*0.6)|0,(r.y+2)|0,(r.r*1.2)|0,1);
  }
  ctx.fillStyle=sky.glow>0.5?"#C9D6DD":"#463C34";
  for(var j=0;j<stones.length;j++) ctx.fillRect(stones[j].x|0,stones[j].y|0,2,2);
  // aim guide
  if(charging){
    var sp=70+charge*205, px=walker.x;
    var py=Math.min(GROUND-20,(EDGE-tide.height*8-3)-7);
    var vx=Math.cos(walker.aim)*sp, vy=Math.sin(walker.aim)*sp;
    var surfG=EDGE-tide.height*8-3;
    var hitA=null, gx=px, gy=py, sim=0;
    for(var k=1;k<=90;k++){
      var tt=k*0.02;
      gx=px+vx*tt; gy=py+vy*tt+0.5*200*tt*tt;
      if(gy>=surfG){ hitA=Math.atan2(Math.abs(vy+200*tt),Math.abs(vx))*DEG; break }
      if(k%3===0){ ctx.fillStyle="rgba(255,217,125,0.30)"; ctx.fillRect(gx|0,gy|0,1,1) }
    }
    // show whether that line will skip or sink, before you let go
    if(hitA!==null){
      var good=hitA<=34;
      ctx.strokeStyle= good ? "rgba(255,217,125,0.75)" : "rgba(200,120,110,0.7)";
      ctx.lineWidth=1;
      ctx.beginPath(); ctx.arc((gx|0)+0.5,(surfG|0)+0.5,good?3:2,0,6.2832); ctx.stroke();
      if(good){
        ctx.fillStyle="rgba(255,217,125,0.5)";
        ctx.fillRect((gx|0)-4,(surfG|0),9,1);
      }
    }
  }
}

// ---- media --------------------------------------------------------
var player=document.getElementById("player");
var playlist=[],ti=-1,urls=[],actx=null,analyser=null,freq=null,bands=new Float32Array(14);
var eqBox=document.getElementById("eq"),eqBars=[];
for(var eb=0;eb<14;eb++){var bi2=document.createElement("i");eqBox.appendChild(bi2);eqBars.push(bi2)}

function initAnalyser(){
  if(actx) return;
  try{
    if(!Snd.boot()) return;
    actx=Snd.ctx;
    var src=actx.createMediaElementSource(player);
    analyser=actx.createAnalyser(); analyser.fftSize=64; analyser.smoothingTimeConstant=0.78;
    src.connect(analyser); analyser.connect(Snd.master);
    freq=new Uint8Array(analyser.frequencyBinCount);
  }catch(e){analyser=null}
}
var extAudio=false,extDecay=0;
function readLevel(dt){
  if(extAudio){extDecay-=dt;if(extDecay<=0)extAudio=false;return}
  if(!analyser||player.paused){
    var target = (Lofi.on||Nocturne.on) ? 0.22+0.12*Math.sin(performance.now()/700) : 0;
    level+=(target-level)*Math.min(1,dt*3);
    for(var i=0;i<14;i++){
      var tb = (Lofi.on||Nocturne.on) ? 0.10+0.5*Math.abs(Math.sin(performance.now()/(420+i*90)+i)) : 0;
      bands[i]+=(tb-bands[i])*Math.min(1,dt*5);
    }
    return;
  }
  analyser.getByteFrequencyData(freq);
  var s=0; for(var j=0;j<8;j++) s+=freq[j];
  level+=(((s/8)/255)-level)*Math.min(1,dt*11);
  for(var k=0;k<14;k++) bands[k]+=(((freq[k+1]||0)/255)-bands[k])*Math.min(1,dt*16);
}
function paintEq(){
  for(var i=0;i<14;i++){
    eqBars[i].style.height=(2+bands[i]*13).toFixed(1)+"px";
    eqBars[i].style.opacity=(0.3+bands[i]*0.7).toFixed(2);
  }
}

var elTrack=document.getElementById("track"),elBar=document.getElementById("barFill"),elPlay=document.getElementById("play");
function loadTrack(i){
  if(!playlist.length) return;
  ti=((i%playlist.length)+playlist.length)%playlist.length;
  player.src=playlist[ti].url;
  elTrack.textContent=playlist[ti].name; elTrack.classList.remove("idle");
  initAnalyser(); if(actx&&actx.state==="suspended") actx.resume();
  if(Lofi.on) Lofi.stop(); if(Nocturne.on) Nocturne.stop(); syncBtns();
  var p=player.play(); if(p&&p.catch) p.catch(function(){elPlay.textContent="Play"});
}
function setPlaylist(files){
  for(var i=0;i<urls.length;i++) URL.revokeObjectURL(urls[i]);
  urls=[];playlist=[];
  for(var j=0;j<files.length;j++){
    var u=URL.createObjectURL(files[j]); urls.push(u);
    playlist.push({name:files[j].name.replace(/\.[^.]+$/,""),url:u});
  }
  if(playlist.length){loadTrack(0);toast(playlist.length+" tracks loaded")}
}
document.getElementById("audioInput").addEventListener("change",function(e){
  if(e.target.files&&e.target.files.length) setPlaylist(e.target.files)});
document.getElementById("pickAudio").addEventListener("click",function(){document.getElementById("audioInput").click()});
document.getElementById("play").addEventListener("click",function(){
  if(!playlist.length){document.getElementById("audioInput").click();return}
  if(actx&&actx.state==="suspended") actx.resume();
  if(player.paused) player.play(); else player.pause();
});
document.getElementById("next").addEventListener("click",function(){loadTrack(ti+1)});
document.getElementById("prev").addEventListener("click",function(){
  if(player.currentTime>3) player.currentTime=0; else loadTrack(ti-1)});
player.addEventListener("play",function(){elPlay.textContent="Pause"});
player.addEventListener("pause",function(){elPlay.textContent="Play"});

var ambBtn=document.getElementById("ambBtn"), lofiBtn=document.getElementById("lofiBtn");
var nightBtn=document.getElementById("nightBtn");
function syncBtns(){
  ambBtn.classList.toggle("on",Snd.ambOn);
  lofiBtn.classList.toggle("on",Lofi.on);
  nightBtn.classList.toggle("on",Nocturne.on);
  if(Nocturne.on){ elTrack.textContent="Nocturne \u2014 composed live, for the dark hours";
                   elTrack.classList.remove("idle") }
  else if(Lofi.on){ elTrack.textContent="Lo-fi \u2014 generated, endless"; elTrack.classList.remove("idle") }
  else if(!playlist.length){ elTrack.textContent="Nothing playing"; elTrack.classList.add("idle") }
}
nightBtn.addEventListener("click",function(){
  Snd.wake();
  if(Nocturne.on) Nocturne.stop();
  else{
    if(Lofi.on) Lofi.stop();
    if(!player.paused) player.pause();
    Nocturne.start();
    toast("Nocturne &mdash; <b>an original piece, composed as it plays</b>");
  }
  syncBtns();
});

  Snd.wake();
  if(Snd.ambOn) Snd.stopAmbience(); else { Snd.startAmbience(); toast("Sea and wind &mdash; all synthesised") }

});
