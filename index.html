<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tidepool</title>
<style>
  :root{
    --ui:1;
    --ink:#EAF2F0; --dim:#8FA6AD; --panel:rgba(9,16,28,.60); --edge:rgba(234,242,240,.11);
    --lantern:#FFD97D; --tide:#6FD3C7;
    --mono:"Cascadia Mono","Cascadia Code",Consolas,"DejaVu Sans Mono",ui-monospace,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#070C16;
    font-family:var(--mono);color:var(--ink);user-select:none;-webkit-user-select:none}
  #scene{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;image-rendering:pixelated;display:block}

  .panel{position:fixed;border-radius:calc(11px*var(--ui));padding:0;line-height:1.5;
    font-size:calc(13px*var(--ui));
    background:linear-gradient(150deg,rgba(255,255,255,.085),rgba(255,255,255,.022) 42%,rgba(6,12,22,.30));
    border:1px solid rgba(255,255,255,.13);
    backdrop-filter:blur(22px) saturate(150%);-webkit-backdrop-filter:blur(22px) saturate(150%);
    box-shadow:0 8px 34px rgba(0,0,0,.34),inset 0 1px 0 rgba(255,255,255,.16),
               inset 0 -1px 0 rgba(255,255,255,.04);
    transition:opacity .45s cubic-bezier(.4,0,.2,1),box-shadow .3s ease,border-color .3s ease,transform .3s ease}
  .panel:hover{border-color:rgba(255,255,255,.20);box-shadow:0 10px 40px rgba(0,0,0,.40),
               inset 0 1px 0 rgba(255,255,255,.22),inset 0 -1px 0 rgba(255,255,255,.05)}
  .panel::after{content:"";position:absolute;inset:0;border-radius:calc(11px*var(--ui));pointer-events:none;
    background:linear-gradient(160deg,rgba(255,255,255,.10),transparent 38%)}
  .panel>*{position:relative;z-index:1}
  .panel .hd{display:flex;align-items:center;gap:calc(8px*var(--ui));
    padding:calc(10px*var(--ui)) calc(14px*var(--ui)) calc(9px*var(--ui));cursor:grab}
  .panel .hd:active{cursor:grabbing}
  .panel .hd h2{margin:0;flex:1;font-size:calc(9.5px*var(--ui));font-weight:600;letter-spacing:.24em;
    text-transform:uppercase;color:var(--dim)}
  .panel .fold{background:none;border:none;color:var(--dim);font-family:var(--mono);font-size:13px;
    line-height:1;padding:2px 4px;cursor:pointer;opacity:.6}
  .panel .fold:hover{opacity:1}
  .panel .bd{padding:0 calc(14px*var(--ui)) calc(14px*var(--ui))}
  .panel.closed .bd{display:none}
  .panel.closed .hd{padding-bottom:10px}

  /* the scene gets bright at midday; a whisper of shade keeps the glass legible */
  #vignette{position:fixed;inset:0;pointer-events:none;z-index:0;
    background:
      radial-gradient(140% 110% at 50% 45%,transparent 52%,rgba(4,10,20,.30) 100%),
      linear-gradient(to bottom,rgba(4,10,20,.16),transparent 22%,transparent 74%,rgba(4,10,20,.20));
    opacity:var(--vig,.55);transition:opacity 2s linear}
  .panel,#toasts,#colophon,#zentag,#audioNag{z-index:2}

  body.zen .panel,body.zen #colophon{opacity:0;pointer-events:none}
  #zentag{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);font-size:9px;
    letter-spacing:.24em;text-transform:uppercase;color:var(--dim);opacity:0;transition:opacity .4s}
  body.zen #zentag{opacity:.35}

  #clock[data-align="center"] .bd,#clock[data-align="center"]{text-align:center}
  #clock[data-align="right"] .bd,#clock[data-align="right"]{text-align:right}
  #clock{background:none;border:none;backdrop-filter:none;box-shadow:none}
  #clock::after{display:none}
  #clock:hover{box-shadow:none;border-color:transparent}
  #clock .hd{display:none}
  #clock .bd{padding:0;text-shadow:0 2px 18px rgba(0,0,0,.75)}
  #time{font-size:calc(56px*var(--ui)*var(--clock,1));font-weight:300;letter-spacing:-.02em;line-height:1;font-variant-numeric:tabular-nums}
  #date{margin-top:calc(5px*var(--ui));font-size:calc(11px*var(--ui)*var(--clock,1));letter-spacing:.28em;text-transform:uppercase;color:var(--dim)}
  #tideline{margin-top:calc(2px*var(--ui));font-size:calc(11px*var(--ui)*var(--clock,1));letter-spacing:.28em;
    text-transform:uppercase;color:var(--dim);opacity:.8}
  #solar{margin-top:calc(2px*var(--ui));font-size:calc(11px*var(--ui)*var(--clock,1));letter-spacing:.28em;text-transform:uppercase;color:var(--tide);opacity:.85}

  #notes{width:calc(268px*var(--ui))}
  #notepad{width:100%;min-height:calc(132px*var(--ui));max-height:30vh;resize:vertical;background:transparent;border:none;
    outline:none;color:var(--ink);font-family:var(--mono);font-size:calc(13px*var(--ui));line-height:1.7;display:block}
  #notepad::placeholder{color:var(--dim);opacity:.5}
  /* the default Windows scrollbar is a wide grey slab that breaks the mood */
  #notepad{scrollbar-width:thin;scrollbar-color:rgba(234,242,240,.24) transparent}
  #notepad::-webkit-scrollbar{width:calc(5px*var(--ui));height:calc(5px*var(--ui))}
  #notepad::-webkit-scrollbar-track{background:transparent}
  #notepad::-webkit-scrollbar-thumb{
    background:linear-gradient(180deg,rgba(234,242,240,.30),rgba(234,242,240,.14));
    border-radius:99px}
  #notepad::-webkit-scrollbar-thumb:hover{background:rgba(234,242,240,.44)}
  #notepad::-webkit-scrollbar-corner{background:transparent}
  #saved{margin-top:6px;font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);
    opacity:0;transition:opacity .24s}
  #saved.show{opacity:.8}

  #sky{width:calc(268px*var(--ui))}
  #skyList{font-size:calc(11px*var(--ui));line-height:1.85;color:var(--dim)}
  #skyList b{color:var(--lantern);font-weight:400}
  #skyFoot{margin-top:7px;font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);opacity:.65}

  #stones{width:calc(218px*var(--ui))}
  .row{display:flex;justify-content:space-between;gap:16px;font-size:calc(12px*var(--ui))}
  .row+.row{margin-top:3px}
  .row span:last-child{font-variant-numeric:tabular-nums;color:var(--lantern)}
  #charge{margin-top:9px;height:3px;background:rgba(234,242,240,.12);overflow:hidden}
  #chargeFill{height:100%;width:0%;background:var(--lantern)}
  #hint{margin-top:8px;font-size:9px;letter-spacing:.13em;text-transform:uppercase;color:var(--dim)}

  #media{width:calc(434px*var(--ui))}
  #track{font-size:calc(12px*var(--ui));white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:8px}
  #track.idle{color:var(--dim)}
  #bar{height:2px;background:rgba(234,242,240,.12);margin-bottom:10px;cursor:pointer}
  #barFill{height:100%;width:0%;background:var(--tide)}
  #eq{display:flex;align-items:flex-end;gap:2px;height:15px;margin-bottom:9px}
  #eq i{flex:1;background:var(--tide);opacity:.5;height:2px;border-radius:1px}
  #ctrls{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .btn{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.13);color:var(--ink);
    font-family:var(--mono);font-size:calc(9.5px*var(--ui));letter-spacing:.13em;text-transform:uppercase;
    padding:calc(6px*var(--ui)) calc(10px*var(--ui));
    cursor:pointer;border-radius:5px;line-height:1;
    transition:background .22s ease,border-color .22s ease,transform .12s ease}
  .btn:hover{background:rgba(255,255,255,.11);border-color:rgba(255,255,255,.26)}
  .btn:active{transform:scale(.96)}
  .btn:focus-visible{outline:2px solid var(--tide);outline-offset:2px}
  .btn.on{border-color:var(--lantern);color:var(--lantern)}
  .sp{flex:1}
  input[type=file]{display:none}

  #toasts{position:fixed;top:36px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;
    gap:8px;align-items:center;pointer-events:none;z-index:5}
  .toast{border-radius:calc(10px*var(--ui));padding:calc(10px*var(--ui)) calc(19px*var(--ui));
    font-size:calc(11px*var(--ui));letter-spacing:.09em;white-space:nowrap;
    background:linear-gradient(150deg,rgba(255,255,255,.09),rgba(6,12,22,.34));
    border:1px solid rgba(255,255,255,.15);
    backdrop-filter:blur(22px) saturate(150%);-webkit-backdrop-filter:blur(22px) saturate(150%);
    box-shadow:0 8px 30px rgba(0,0,0,.34),inset 0 1px 0 rgba(255,255,255,.18);
    opacity:0;transform:translateY(-10px) scale(.97);
    transition:opacity .55s cubic-bezier(.4,0,.2,1),transform .55s cubic-bezier(.4,0,.2,1)}
  .toast.in{opacity:1;transform:translateY(0) scale(1)}
  .toast b{color:var(--lantern);font-weight:400}

  #colophon{position:fixed;font-size:calc(9px*var(--ui));letter-spacing:.2em;text-transform:uppercase;
    color:var(--dim);opacity:.35;text-align:right;line-height:2;transition:opacity .35s}

  #starinfo{position:fixed;z-index:6;pointer-events:none;opacity:0;
    padding:calc(9px*var(--ui)) calc(13px*var(--ui));border-radius:calc(9px*var(--ui));
    background:linear-gradient(150deg,rgba(255,255,255,.09),rgba(6,12,22,.44));
    border:1px solid rgba(255,255,255,.15);min-width:calc(178px*var(--ui));
    backdrop-filter:blur(20px) saturate(150%);-webkit-backdrop-filter:blur(20px) saturate(150%);
    box-shadow:0 8px 26px rgba(0,0,0,.36),inset 0 1px 0 rgba(255,255,255,.16);
    transition:opacity .18s ease,left .09s linear,top .09s linear}
  #starinfo.on{opacity:1}
  #starinfo .sn{font-size:calc(13px*var(--ui));margin-bottom:calc(6px*var(--ui));color:var(--ink)}
  #starinfo .sr{display:flex;justify-content:space-between;gap:calc(16px*var(--ui));
    font-size:calc(10px*var(--ui));color:var(--dim);line-height:1.9}
  #starinfo .sr span:last-child{color:var(--tide);font-variant-numeric:tabular-nums}
  #starinfo .sf{margin-top:calc(6px*var(--ui));font-size:calc(9.5px*var(--ui));
    color:var(--lantern);opacity:.85;line-height:1.6;max-width:calc(210px*var(--ui))}
  body.zen #starinfo{opacity:0}

  #audioNag{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);z-index:8;
    padding:11px 20px;border-radius:9px;font-size:11px;line-height:1.7;text-align:center;
    background:linear-gradient(150deg,rgba(255,255,255,.10),rgba(6,12,22,.42));
    border:1px solid rgba(255,217,125,.34);color:var(--ink);cursor:pointer;
    backdrop-filter:blur(22px) saturate(150%);-webkit-backdrop-filter:blur(22px) saturate(150%);
    box-shadow:0 8px 30px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.16)}
  body.zen #audioNag{opacity:0;pointer-events:none;transition:opacity .4s}

  @media (max-width:1250px){#sky{display:none}}
  @media (max-width:1080px){#notes,#colophon{display:none}}
</style>
</head>
<body>

<canvas id="scene" width="576" height="324"></canvas>
<div id="vignette"></div>

<div class="panel" id="clock" data-fixed="1">
  <div class="hd"><h2>Time</h2></div>
  <div class="bd"><div id="time">--:--</div><div id="date">&nbsp;</div><div id="solar">&nbsp;</div><div id="tideline">&nbsp;</div></div>
</div>

<div class="panel" id="notes">
  <div class="hd"><h2>Notes</h2><button class="fold" title="Collapse">&minus;</button></div>
  <div class="bd">
    <textarea id="notepad" spellcheck="false" placeholder="Anything you need to keep in front of you."></textarea>
    <div id="saved">Saved</div>
  </div>
</div>

<div class="panel" id="sky">
  <div class="hd"><h2>Overhead now</h2><button class="fold" title="Collapse">&minus;</button></div>
  <div class="bd"><div id="skyList"></div><div id="skyFoot">Click a star to trace &middot; <b>,</b> and <b>.</b> turn the view</div></div>
</div>

<div class="panel" id="stones">
  <div class="hd"><h2>Skipping stones</h2><button class="fold" title="Collapse">&minus;</button></div>
  <div class="bd">
    <div class="row"><span>Last throw</span><span id="last">&mdash;</span></div>
    <div class="row"><span>Best</span><span id="best">0</span></div>
    <div class="row"><span>Gulls startled</span><span id="startled">0</span></div>
    <div id="charge"><div id="chargeFill"></div></div>
    <div id="hint">Aim low and flat for a long run</div>
  </div>
</div>

<div class="panel" id="media">
  <div class="hd"><h2>Sound</h2><button class="fold" title="Collapse">&minus;</button></div>
  <div class="bd">
    <div id="track" class="idle">Nothing playing</div>
    <div id="bar"><div id="barFill"></div></div>
    <div id="eq"></div>
    <div id="ctrls">
      <button class="btn" id="ambBtn">Ambience</button>
      <button class="btn" id="lofiBtn">Lo-fi</button>
      <button class="btn" id="nightBtn">Nocturne</button>
      <div class="sp"></div>
      <button class="btn" id="prev">Prev</button>
      <button class="btn" id="play">Play</button>
      <button class="btn" id="next">Next</button>
      <button class="btn" id="pickAudio">Files</button>
      <button class="btn" id="pickVideo">Film</button>
      <button class="btn" id="screenToggle">Screen</button>
    </div>
  </div>
</div>

<div id="starinfo"></div>
<div id="toasts"></div>
<div id="zentag">Press H for the widgets</div>
<div id="colophon">Tidepool v21<br>No network &middot; real sky &middot; synthesised sound</div>

<input type="file" id="audioInput" accept="audio/*" multiple>
<input type="file" id="videoInput" accept="video/*">
<audio id="player"></audio>
<video id="film" playsinline muted loop></video>

<script>
(function(){
"use strict";

var LAT=44.8878, LON=20.5178, TARGET_FPS=60;
var autoSound=true, autoLofi=false;
var RAD=Math.PI/180, DEG=180/Math.PI;
var W=576, H=324;   // W is recomputed from the display aspect at runtime
var HORIZON=166, EDGE=247, GROUND=260;      // sky | sea | foam line | walker's feet
// In the northern hemisphere the sun and stars culminate in the SOUTH, so
// the camera faces south and east falls on the left. South of the equator
// they culminate in the NORTH, the camera faces north, and east is on the
// right — which is why southern skies appear to run the other way.
var FOV=250;
// Which way the camera looks, as a compass bearing. You cannot see the whole
// sky at once, so this matters: face the equator and you get the sun's arc but
// the pole is behind you; face the pole and you get the circumpolar figures.
// Default is equator-ward, which is where the sun and moon are.
var VIEW=null;
function facing(){ return VIEW===null ? (LAT>=0?180:0) : VIEW }
function turnView(deg){
  VIEW=(((facing()+deg)%360)+360)%360;
  store.set("tidepool.view",String(VIEW));
  var pts=["north","north-east","east","south-east","south","south-west","west","north-west"];
  toast("Looking "+pts[Math.round(VIEW/45)%8]);
  updateClock();
}
var BREAK_MINUTES=20;

var store={
  get:function(k,d){try{var v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}},
  set:function(k,v){try{localStorage.setItem(k,v);return true}catch(e){return false}}
};

// ===================================================================
// SOUND — everything below is synthesised. No audio files, no network.
// ===================================================================
var Snd = {
  ctx:null, master:null, ambGain:null, musGain:null,
  ambOn:false, musOn:false, ready:false,

  boot:function(){
    if(this.ctx) return true;
    var AC=window.AudioContext||window.webkitAudioContext;
    if(!AC) return false;
    try{
      this.ctx=new AC();
      this.master=this.ctx.createGain(); this.master.gain.value=0.85;
      this.master.connect(this.ctx.destination);
      this.ambGain=this.ctx.createGain(); this.ambGain.gain.value=0; this.ambGain.connect(this.master);
      this.musGain=this.ctx.createGain(); this.musGain.gain.value=0; this.musGain.connect(this.master);
      this.pan=c=>{var q=this.ctx.createStereoPanner?this.ctx.createStereoPanner():null;return q};
      this.ready=true;
      this.wake();
      return true;
    }catch(e){ return false }
  },

  // Chrome creates contexts suspended. Without this nothing is ever heard.
  wake:function(){
    if(!this.ctx) return;
    if(this.ctx.state==="suspended"){
      var p=this.ctx.resume();
      if(p&&p.catch) p.catch(function(){});
    }
  },

  noiseBuf:function(sec,brown){
    var n=Math.floor(this.ctx.sampleRate*sec);
    var b=this.ctx.createBuffer(1,n,this.ctx.sampleRate), d=b.getChannelData(0);
    var last=0;
    for(var i=0;i<n;i++){
      var w=Math.random()*2-1;
      if(brown){ last=(last+0.02*w)/1.02; d[i]=last*3.5 } else d[i]=w;
    }
    return b;
  },

  // --- sea, wind: looping filtered noise with a slow swell --------
  startAmbience:function(){
    if(!this.boot()||this.ambOn) return;
    var c=this.ctx, t=c.currentTime;

    var surf=c.createBufferSource(); surf.buffer=this.noiseBuf(6,true); surf.loop=true;
    var sf=c.createBiquadFilter(); sf.type="lowpass"; sf.frequency.value=520; sf.Q.value=0.6;
    var sg=c.createGain(); sg.gain.value=0.34;
    surf.connect(sf); sf.connect(sg); sg.connect(this.ambGain); surf.start();

    var foam=c.createBufferSource(); foam.buffer=this.noiseBuf(5,false); foam.loop=true;
    var ff=c.createBiquadFilter(); ff.type="bandpass"; ff.frequency.value=2100; ff.Q.value=0.5;
    var fg=c.createGain(); fg.gain.value=0.028;
    foam.connect(ff); ff.connect(fg); fg.connect(this.ambGain); foam.start();

    // swell: two out-of-phase LFOs so waves never land on a metronome
    var l1=c.createOscillator(); l1.frequency.value=0.085;
    var l1g=c.createGain(); l1g.gain.value=0.16;
    l1.connect(l1g); l1g.connect(sg.gain); l1.start();

    var l2=c.createOscillator(); l2.frequency.value=0.053;
    var l2g=c.createGain(); l2g.gain.value=0.020;
    l2.connect(l2g); l2g.connect(fg.gain); l2.start();

    var l3=c.createOscillator(); l3.frequency.value=0.037;
    var l3g=c.createGain(); l3g.gain.value=180;
    l3.connect(l3g); l3g.connect(sf.frequency); l3.start();

    var wind=c.createBufferSource(); wind.buffer=this.noiseBuf(7,true); wind.loop=true;
    var wf=c.createBiquadFilter(); wf.type="lowpass"; wf.frequency.value=340;
    var wg=c.createGain(); wg.gain.value=0.07;
    wind.connect(wf); wf.connect(wg); wg.connect(this.ambGain); wind.start();
    var l4=c.createOscillator(); l4.frequency.value=0.028;
    var l4g=c.createGain(); l4g.gain.value=0.045;
    l4.connect(l4g); l4g.connect(wg.gain); l4.start();

    this.ambGain.gain.cancelScheduledValues(t);
    this.ambGain.gain.setValueAtTime(0.0001,t);
    this.ambGain.gain.linearRampToValueAtTime(0.9,t+2.5);
    this.ambOn=true;
  },
  stopAmbience:function(){
    if(!this.ready||!this.ambOn) return;
    var t=this.ctx.currentTime;
    this.ambGain.gain.cancelScheduledValues(t);
    this.ambGain.gain.setValueAtTime(this.ambGain.gain.value,t);
    this.ambGain.gain.linearRampToValueAtTime(0.0001,t+1.2);
    this.ambOn=false;
  },

  // --- a wave breaking: long swell in, sharp crash, hiss of retreat ---
  breakWave:function(size){
    if(!this.ready||!this.ambOn) return;
    var c=this.ctx, t=c.currentTime;
    var big = size===undefined ? Math.random() : size;
    var rise = 0.9+big*1.5, crash = 0.16, tail = 1.6+big*1.9;
    var peak = 0.055+big*0.115;

    var dest=this.ambGain;
    if(c.createStereoPanner){
      var pn=c.createStereoPanner(); pn.pan.value=(Math.random()*2-1)*0.6;
      pn.connect(this.ambGain); dest=pn;
    }

    // the body of the wave rolling in
    var n=c.createBufferSource(); n.buffer=this.noiseBuf(6,true); n.loop=true;
    var f=c.createBiquadFilter(); f.type="lowpass";
    f.frequency.setValueAtTime(260,t);
    f.frequency.linearRampToValueAtTime(1500+big*1400,t+rise+crash);
    f.frequency.exponentialRampToValueAtTime(320,t+rise+crash+tail);
    var g=c.createGain();
    g.gain.setValueAtTime(0.0001,t);
    g.gain.linearRampToValueAtTime(peak*0.42,t+rise*0.75);
    g.gain.linearRampToValueAtTime(peak,t+rise+crash);
    g.gain.exponentialRampToValueAtTime(0.0001,t+rise+crash+tail);
    n.connect(f); f.connect(g); g.connect(dest);
    n.start(t); n.stop(t+rise+crash+tail+0.2);

    // the white hiss of it collapsing and draining back
    var h=c.createBufferSource(); h.buffer=this.noiseBuf(4,false); h.loop=true;
    var hf=c.createBiquadFilter(); hf.type="highpass";
    hf.frequency.setValueAtTime(1100,t);
    hf.frequency.linearRampToValueAtTime(4200,t+rise+crash+tail*0.8);
    var hg=c.createGain();
    hg.gain.setValueAtTime(0.0001,t+rise*0.6);
    hg.gain.linearRampToValueAtTime(peak*0.6,t+rise+crash+0.1);
    hg.gain.exponentialRampToValueAtTime(0.0001,t+rise+crash+tail);
    h.connect(hf); hf.connect(hg); hg.connect(dest);
    h.start(t+rise*0.6); h.stop(t+rise+crash+tail+0.2);
  },

  // --- one-shots -------------------------------------------------
  gull:function(){
    if(!this.ready||!this.ambOn) return;
    var c=this.ctx, t=c.currentTime;
    for(var k=0;k<3;k++){
      var s=t+k*0.19;
      var o=c.createOscillator(); o.type="sawtooth";
      var g=c.createGain(), f=c.createBiquadFilter();
      f.type="bandpass"; f.frequency.value=1750; f.Q.value=5;

    var t=Snd.ctx.currentTime;
    Snd.musGain.gain.cancelScheduledValues(t);
    Snd.musGain.gain.setValueAtTime(Snd.musGain.gain.value,t);
    Snd.musGain.gain.linearRampToValueAtTime(0.0001,t+1.6);

      Snd.ambGain.gain.setValueAtTime(Snd.ambGain.gain.value,t);

    this.voice(ch[0]+36+k, t, beat*1.6, "sine", 0.19, 320);
    if(this.bar%2===0) this.voice(ch[0]+36+k, t+beat*2.5, beat*1.1, "sine", 0.14, 320);

    // pad
    for(var i=0;i<ch.length;i++)
      this.voice(ch[i]+60+k, t+0.01*i, beat*3.7, "triangle", 0.030, 950);

    // rhodes comp on the off-beats
    var comp=[1.5,2.5,3.5];
    for(var j=0;j<comp.length;j++){
      if(Math.random()<0.78){
        var note=ch[1+Math.floor(Math.random()*(ch.length-1))]+60+k;
        this.rhodes(note, t+beat*comp[j]+swing, beat*0.9, 0.055);
      }
    }

    // drums, swung
    this.kick(t);
    if(Math.random()<0.5) this.kick(t+beat*2.5);
    this.snare(t+beat*2);
    if(Math.random()<0.35) this.snare(t+beat*3.75,true);
    for(var h=0;h<8;h++){
      var off = (h%2) ? swing : 0;
      this.hat(t+beat*h*0.5+off, (h%2)?0.010:0.019);
    }

    // melody: sparse pentatonic wander, rests on purpose
    if(Math.random()<0.72){
      var slots=[0,1,1.5,2,3,3.5];
      var count=1+Math.floor(Math.random()*3);
      for(var m=0;m<count;m++){

        this.rhodes(72+k+deg+oct*12, t+beat*s+((s%1)?swing:0), beat*0.8, 0.048);
      }
    }
    this.bar++;
  }
};

function julian(d){

  return Math.floor(365.25*(y+4716))+Math.floor(30.6001*(m+1))+day+b-1524.5;
}

function relAz(az){

function solar(d){
  var start=new Date(d.getFullYear(),0,0);
  var doy=Math.floor((d-start)/86400000);
  var hr=d.getHours(),mi=d.getMinutes(),se=d.getSeconds(), tz=-d.getTimezoneOffset()/60;
  var g=(2*Math.PI/365)*(doy-1+(hr-12)/24);
  var eq=229.18*(0.000075+0.001868*Math.cos(g)-0.032077*Math.sin(g)
        -0.014615*Math.cos(2*g)-0.040849*Math.sin(2*g));
  var decl=0.006918-0.399912*Math.cos(g)+0.070257*Math.sin(g)
        -0.006758*Math.cos(2*g)+0.000907*Math.sin(2*g)
        -0.002697*Math.cos(3*g)+0.001480*Math.sin(3*g);
  var tst=hr*60+mi+se/60+eq+4*LON-60*tz;
  var ha=(tst/4-180)*RAD, la=LAT*RAD;
  var cz=Math.max(-1,Math.min(1,Math.sin(la)*Math.sin(decl)+Math.cos(la)*Math.cos(decl)*Math.cos(ha)));
  var zen=Math.acos(cz), alt=90-zen*DEG, az=180, den=Math.sin(zen)*Math.cos(la);
  if(Math.abs(den)>1e-6){
    var ca=Math.max(-1,Math.min(1,(Math.sin(decl)-Math.sin(la)*cz)/den));
    az=Math.acos(ca)*DEG; if(ha>0) az=360-az;
  }
  var rise=null,set=null;
  var ch=Math.cos(90.833*RAD)/(Math.cos(la)*Math.cos(decl))-Math.tan(la)*Math.tan(decl);
  if(ch>=-1&&ch<=1){var Hd=Math.acos(ch)*DEG; rise=720-4*(LON+Hd)-eq+tz*60; set=720-4*(LON-Hd)-eq+tz*60}
  return {alt:alt,az:az,rise:rise,set:set};
}
function hhmm(m){
  if(m===null) return "--:--";
  m=((m%1440)+1440)%1440;
  var h=Math.floor(m/60),n=Math.round(m%60); if(n===60){n=0;h=(h+1)%24}
  return (h<10?"0":"")+h+":"+(n<10?"0":"")+n;
}

// ===================================================================
// THE MOON, properly. Low-precision lunar theory (Meeus ch.47 abridged):
// good to about a degree, which is far better than "opposite the sun".
// ===================================================================
var moon={alt:0, az:180, ra:0, dec:0, phase:0, lit:0, waxing:true};

function updateMoon(d){
  var T=(julian(d)-2451545.0)/36525;
  var Lp=218.3164477+481267.88123421*T;          // mean longitude
  var M =134.9633964+477198.8675055*T;           // mean anomaly
  var Ms=357.5291092+35999.0502909*T;            // sun's mean anomaly
  var F = 93.2720950+483202.0175233*T;           // argument of latitude
  var D =297.8501921+445267.1114034*T;           // mean elongation
  var r=RAD;
  // the handful of terms that actually matter at this scale
  var lon=Lp + 6.289*Math.sin(M*r)
             + 1.274*Math.sin((2*D-M)*r)
             + 0.658*Math.sin(2*D*r)
             + 0.214*Math.sin(2*M*r)
             - 0.186*Math.sin(Ms*r)
             - 0.114*Math.sin(2*F*r);
  var lat= 5.128*Math.sin(F*r)
             + 0.281*Math.sin((M+F)*r)
             - 0.278*Math.sin((F-M)*r)
             - 0.173*Math.sin((2*D-F)*r);
  var eps=23.4392911*r;
  var l=lon*r, b=lat*r;
  var ra=Math.atan2(Math.sin(l)*Math.cos(eps)-Math.tan(b)*Math.sin(eps),Math.cos(l));
  var dec=Math.asin(Math.sin(b)*Math.cos(eps)+Math.cos(b)*Math.sin(eps)*Math.sin(l));
  moon.ra=((ra*DEG)%360+360)%360; moon.dec=dec*DEG;

  var L=lstDeg(d), la=LAT*r;
  var ha=(((L-moon.ra)%360+360)%360)*r;
  var sa=Math.max(-1,Math.min(1,Math.sin(dec)*Math.sin(la)+Math.cos(dec)*Math.cos(la)*Math.cos(ha)));
  moon.alt=Math.asin(sa)*DEG;
  moon.az=(Math.atan2(-Math.sin(ha)*Math.cos(dec),
      Math.sin(dec)*Math.cos(la)-Math.cos(dec)*Math.sin(la)*Math.cos(ha))*DEG+360)%360;

  // elongation from the sun gives the illuminated fraction directly
  var elong=((moon.ra - (D>0?0:0)) ,0);
  var ph=((lon - (280.46646+36000.76983*T))%360+360)%360;   // moon minus sun longitude
  moon.phase=ph/360;                        // 0 new, .5 full
  moon.lit=(1-Math.cos(ph*r))/2;
  moon.waxing=ph<180;
}

// ===================================================================
// TIDES. The Moon and Sun pull the ocean; when they line up at new and
// full moon their pulls add and you get spring tides, when they are at
// right angles at the quarters they partly cancel and you get neaps.
// The cycle itself is semidiurnal: two highs and two lows per lunar day.
// ===================================================================
var tide={t:0, height:0, range:0.6, current:0, slack:false, rising:true, state:"Slack water"};

function updateTide(d){
  // springness: 1 when Sun, Earth and Moon are in line, 0 at the quarters
  var springness=Math.abs(Math.cos(moon.phase*2*Math.PI));
  tide.range=0.34+springness*0.66;

  // semidiurnal period is 12h25m; anchor it to the moon's hour angle so
  // high water tracks the Moon's passage rather than the clock
  var L=lstDeg(d);
  var lunarHA=(((L-moon.ra)%360+360)%360)/360;      // 0..1 per lunar day
  tide.t=(lunarHA*2)%1;                             // two tides per lunar day

  tide.height =Math.cos(tide.t*2*Math.PI)*tide.range;
  tide.current=Math.abs(Math.sin(tide.t*2*Math.PI))*tide.range;
  tide.rising =Math.sin(tide.t*2*Math.PI)<0;
  tide.slack  =tide.current<0.11;
  tide.state  = tide.slack ? (tide.height>0?"High water":"Low water")
              : tide.rising ? "Flooding" : "Ebbing";
}

// Landmarks live at fractions of the width, so an ultrawide monitor gets more
// coastline rather than a vertical crop of the same picture.
var LM={}, Q=2;   // supersample factor: the buffer is Q times the design grid
function layout(){
  var aspect=(window.innerWidth||1920)/(window.innerHeight||1080);
  var want=Math.round(H*aspect);
  W=Math.max(510,Math.min(1180,want));
  if(W%2) W++;
  // Draw coordinates stay in design units; the backing store is Q times
  // larger. Flat fills look identical, but gradients, circles and video get
  // Q times the resolution, and the final stretch to the screen is far
  // gentler — which is the whole of the "it looks softer in a browser"
  // problem, since a windowed canvas was being upscaled far less.
  cv.width=W*Q; cv.height=H*Q;
  ctx.setTransform(Q,0,0,Q,0,0);
  ctx.imageSmoothingEnabled=false;

  LM.pier   = 52;
  LM.island = W-30;
  LM.cinema = W-152;
  LM.buoy   = Math.round(W*0.60);
  LM.walkMin= 62;
  LM.walkMax= W-88;

  SCR.x=LM.cinema; SCR.y=EDGE-62;
  buoy.x=LM.buoy;
  surfSpots[0].x=34;
  surfSpots[1].x=LM.island;
  if(walker.x>LM.walkMax) walker.x=LM.walkMax;
  if(walker.x<LM.walkMin) walker.x=LM.walkMin;

  // re-seed clouds across the new width
  for(var i=0;i<clouds.length;i++) if(clouds[i].x>W) clouds[i].x=Math.random()*W;

}
